<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Leaderboard</title>
<style>
body { margin:0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #000, #111); color:white; }
h1 { text-align:center; color:#0ff; margin-top:20px; }
#leaderboards { display:flex; justify-content:center; gap:50px; flex-wrap:wrap; margin-top:30px; }
table { border-collapse: collapse; width:300px; background: rgba(0,0,0,0.6); border-radius:10px; }
th, td { padding:10px; text-align:left; border-bottom:1px solid #0ff; }
th { background:#111; color:#0ff; }
tr:hover { background: rgba(0,255,255,0.2); }
#backBtn { position:fixed; top:20px; left:20px; padding:10px 15px; background:#0ff; color:#000; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
#backBtn:hover { background:#0cc; }
</style>
</head>
<body>

<button id="backBtn">← Back to Game</button>
<h1>Firework Leaderboards</h1>
<div id="leaderboards">
  <div>
    <h2 style="text-align:center;">Top Money</h2>
    <table id="moneyTable">
      <tr><th>Player</th><th>Money</th></tr>
    </table>
  </div>
  <div>
    <h2 style="text-align:center;">Top Rebirths</h2>
    <table id="rebirthTable">
      <tr><th>Player</th><th>Rebirths</th></tr>
    </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ---------- FIREBASE ----------
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com/",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1",
  measurementId: "G-H07BZY385S"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------- BACK BUTTON ----------
document.getElementById("backBtn").addEventListener("click", ()=>{
    window.location.href = "firework.html";
});

// ---------- LOAD LEADERBOARD ----------
function updateLeaderboards(){
    db.ref("players").once("value", snapshot=>{
        const data = snapshot.val() || {};

        const moneyArr = Object.entries(data).map(([name,val])=>({name,money:val.money||0})).sort((a,b)=>b.money-a.money);
        const moneyTable = document.getElementById("moneyTable");
        moneyTable.innerHTML = "<tr><th>Player</th><th>Money</th></tr>";
        moneyArr.forEach(p=>{
            const row = moneyTable.insertRow();
            row.insertCell(0).textContent = p.name;
            row.insertCell(1).textContent = p.money;
        });

        const rebirthArr = Object.entries(data).map(([name,val])=>({name,rebirths:val.rebirths||0})).sort((a,b)=>b.rebirths-a.rebirths);
        const rebirthTable = document.getElementById("rebirthTable");
        rebirthTable.innerHTML = "<tr><th>Player</th><th>Rebirths</th></tr>";
        rebirthArr.forEach(p=>{
            const row = rebirthTable.insertRow();
            row.insertCell(0).textContent = p.name;
            row.insertCell(1).textContent = p.rebirths;
        });
    });
}

// Update immediately, then every 5 seconds
updateLeaderboards();
setInterval(updateLeaderboards,5000);
</script>
</body>
</html>
