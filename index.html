<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
}

#canvas {
  position: fixed;
  inset: 0;
}

/* LOGIN */
#loginBox {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.7);
  z-index: 10;
}
#loginBox input, #loginBox button {
  margin: 6px;
  padding: 10px;
  width: 220px;
}
#loginBox button {
  background: cyan;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

/* GAME UI */
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 5;
  display: none;
}
#ownerCommands {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 5;
  display: none;
}
#ownerCommands button {
  display: block;
  margin-bottom: 4px;
}

/* EVENT STATUS */
#eventStatus {
  position: fixed;
  bottom: 12px;
  right: 12px;
  background: rgba(0,0,0,0.75);
  color: #0ff;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
  z-index: 9999;
  pointer-events: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="loginBox">
  <h2>Firework Simulator</h2>
  <input id="username" placeholder="Username">
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <button id="forgotBtn">Forgot Password</button>
  <p id="loginMsg"></p>
</div>

<div id="ui">
  <div>Money: $<span id="money">0</span></div>
  <div>Multiplier: x<span id="moneyMultiplier">1</span></div>
  <div>Colors: <span id="unlockedColors">1</span></div>
  <button id="buyColor">Buy Color</button>
  <button id="reduceDelay">Reduce Delay</button>
  <button id="buyAuto">Buy Auto</button>
  <button id="rebirth">Rebirth</button>
  <button id="resetBtn">Reset</button>
  <button id="logoutBtn">Logout</button>
  <button id="goLeaderboardBtn">Leaderboard</button>
</div>

<div id="ownerCommands">
  <button data-event="doubleMoney">Double Money</button>
  <button data-event="rainbowMode">Rainbow Mode</button>
  <button data-event="chaosRoll">Chaos Roll</button>
  <button data-event="blackout">Blackout</button>
  <button data-event="glitch">Glitch</button>
  <button data-event="chainReaction">Chain Reaction</button>
  <button data-event="cosmicMode">Cosmic Mode</button>
  <button data-event="luckyExplosions">Lucky Explosions</button>
  <button data-event="goldenFirework">Golden Firework</button>
  <button data-event="adminStorm">Admin Storm</button>
</div>

<div id="eventStatus"></div>

<audio id="fireworkSound" src="assets/firework.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="game.js"></script>

</body>
</html>
