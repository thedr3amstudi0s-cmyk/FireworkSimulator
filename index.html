<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
}

canvas {
  display: block;
}

/* LOGIN */
#loginBox {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #222;
  padding: 25px;
  border-radius: 10px;
  color: white;
  z-index: 10;
}

#loginBox input, #loginBox button {
  width: 220px;
  padding: 10px;
  margin: 6px 0;
  border-radius: 5px;
  border: none;
}

/* UI */
#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  color: white;
  display: none;
}

#ui button {
  margin: 3px;
}

#cooldownBar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 260px;
  height: 16px;
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
}

#cooldownFill {
  height: 100%;
  width: 0%;
  background: lime;
  border-radius: 8px;
}

/* TOP RIGHT */
#logoutBtn, #resetBtn {
  position: fixed;
  right: 10px;
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

#logoutBtn { top: 10px; background: orange; }
#resetBtn { top: 50px; background: red; color: white; }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="loginBox">
  <h2>Firework Simulator</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <p id="loginMsg"></p>
</div>

<div id="ui">
  <p>Money: $<span id="money">0</span></p>
  <button id="buyColor">Buy Color</button>
  <button id="reduceDelay">Reduce Delay</button>
  <button id="buyAuto">Buy Auto</button>
  <button id="rebirth">Rebirth</button>
  <p>Colors: <span id="colorText">1</span></p>
</div>

<button id="logoutBtn" style="display:none;">Logout</button>
<button id="resetBtn" style="display:none;">Reset Progress</button>

<div id="cooldownBar"><div id="cooldownFill"></div></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script src="game.js"></script>
</body>
</html>
