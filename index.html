<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; font-family: Arial, sans-serif;}
canvas { display:block; background: radial-gradient(circle at bottom, #0a0a0a, #000);}
#loginBox { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background: linear-gradient(135deg,#1a1a1a,#333); padding:40px; border-radius:15px; color:white; z-index:200; box-shadow: 0 0 20px rgba(0,255,255,0.3);}
#loginBox input, #loginBox button{ display:block; margin:10px 0; padding:10px 15px; font-size:16px; border-radius:5px; border:none;}
#loginBox input { width: 250px; }
#loginBox button { background: cyan; color:#000; font-weight:bold; cursor:pointer; }
#loginBox button:hover { background: #0ff; }
#ui{position:fixed; top:10px; left:10px; color:white; z-index:100;}
#ui button{margin:2px; padding:5px 10px; font-size:14px; cursor:pointer;}
#ownerCommands{margin-top:10px; display:none;}
#ownerCommands button{margin:2px; padding:5px 10px; font-size:14px; cursor:pointer; background:#222; color:cyan;}
#cooldownBar{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:300px; height:20px; background:rgba(255,255,255,0.2); border-radius:10px; overflow:hidden; z-index:150;}
#cooldownFill{height:100%; width:0%; background:limegreen; transition:width 0.05s linear;}
#resetBtn{position:fixed; top:10px; right:10px; z-index:150; padding:5px 10px; font-size:14px; cursor:pointer; display:none; background:red; color:white; border:none; border-radius:5px;}
/* LOADER */
#loader { position:fixed; inset:0; background:#4a90e2; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; opacity:1; transition:opacity 0.7s; }
#loader .logo-svg { width:150px; height:80px; margin:0 auto 15px; display:block; }
#loader .logo-svg path { stroke-dasharray: 400; stroke-dashoffset: 400; animation: drawPath 2s forwards; stroke:#fff; stroke-width:5; fill:transparent; stroke-linecap:round; transition:0.3s; }
#loader .loader-text { color:white; font-size:1.3rem; letter-spacing:1px; margin-top:20px; }
@keyframes drawPath { to { stroke-dashoffset:0; } }
/* Prevent text selection */
body, button, input, p, h2, h1, span { user-select: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- LOADER -->
<div id="loader">
  <svg class="logo-svg" viewBox="0 0 200 80">
    <path d="M10 10 L10 70 L50 70 Q70 70 70 40 Q70 10 50 10 Z" />
    <path d="M80 70 C120 70, 120 40, 80 40 C40 40, 40 10, 80 10" />
  </svg>
  <div class="loader-text">Loading Firework Simulator...</div>
</div>

<div id="loginBox">
<h2 style="text-align:center; color:#0ff;">Firework Simulator Login</h2>
<input type="text" id="username" placeholder="Username">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login</button>
<button id="signupBtn">Sign Up</button>
<button id="forgotBtn" style="background:#444;color:white;">Forgot Password?</button>
<p id="loginMsg" style="color:yellow"></p>
</div>

<div id="ui" style="display:none;">
<h2>Money: $<span id="money">0</span></h2>
<button id="buyColor">Buy Color ($<span id="colorPrice">50</span>)</button>
<button id="reduceDelay">Reduce Delay ($<span id="delayPrice">100</span>)</button>
<button id="rebirth">Rebirth ($<span id="rebirthPrice">500</span>)</button>
<button id="buyAuto">Buy Auto-Launch ($<span id="autoPrice">200</span>)</button>
<button id="goLeaderboardBtn">View Leaderboard</button>
<p>Unlocked Colors: <span id="unlockedColors">1</span></p>
<p>Click Delay: <span id="delayDisplay">1200</span> ms</p>
<p>Firework Money Multiplier: x<span id="moneyMultiplier">1</span></p>
<p>Auto Speed: <span id="autoSpeedDisplay">2.50</span> sec</p>
<p id="ownerMsg" style="color: cyan; display:none;">Owner Mode Active</p>
<div id="ownerCommands">
<h3>Owner Commands</h3>
<button id="giveMoneyBtn">Give $1000</button>
<button id="unlockColorsBtn">Unlock All Colors</button>
<button id="maxAutoBtn">Max Auto-Launch</button>
<button id="viewUsersBtn">View Users</button>
</div>
</div>

<button id="resetBtn">Reset Progress</button>
<div id="cooldownBar"><div id="cooldownFill"></div></div>

<!-- AUDIO -->
<audio id="fireworkSound" src="assets/single-firework-79814.mp3"></audio>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ----------------- FIREBASE INIT -----------------
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1",
  measurementId: "G-H07BZY385S"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ----------------- VARIABLES -----------------
const loginBox = document.getElementById("loginBox");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const loginMsg = document.getElementById("loginMsg");
const ui = document.getElementById("ui");
const ownerMsg = document.getElementById("ownerMsg");
const ownerCommands = document.getElementById("ownerCommands");
const resetBtn = document.getElementById("resetBtn");
const goLeaderboardBtn = document.getElementById("goLeaderboardBtn");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
window.addEventListener("resize",()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});

let currentUser = "";
let money=0, unlockedColors=1, clickDelay=1200, lastClick=Date.now(), moneyMultiplier=1, rebirthCount=0;
let colorPrice=50, delayPrice=100, rebirthPrice=500, maxClickDelay=100, autoPrice=200, autoAmount=0, autoSpeed=2.5;
const maxAutoUpgrades=3;
const maxColorsPerRebirth=10;
const baseColors=[{color:"hsl(0,100%,60%)",value:1},{color:"hsl(30,100%,60%)",value:2},{color:"hsl(60,100%,60%)",value:3},{color:"hsl(120,100%,60%)",value:4},{color:"hsl(180,100%,60%)",value:5},{color:"hsl(240,100%,60%)",value:6}];
let colors=[...baseColors];
let fireworks=[], particles=[];
const gravity=0.04;
const fireworkSound=document.getElementById("fireworkSound");
let autoInterval=null;

// ----------------- AUTH -----------------
auth.onAuthStateChanged(user=>{
  if(user){
    currentUser = user.uid;
    showUI(false);
    loadProgress();
  }
});

// ----------------- FORGOT PASSWORD -----------------
document.getElementById("forgotBtn").addEventListener("click",()=>{
  const email = document.getElementById("email").value.trim();
  if(!email){ loginMsg.textContent="Enter your email first!"; return;}
  auth.sendPasswordResetEmail(email)
    .then(()=>{ loginMsg.textContent="Password reset email sent!"; })
    .catch(err=>{ loginMsg.textContent=err.message; });
});

// ----------------- FIREWORK CLASSES -----------------
class Firework{constructor(x,y,colorObj){this.x=x;this.y=canvas.height;this.targetY=y;this.speed=Math.random()*2+4;this.colorObj=colorObj;}
update(){this.y-=this.speed;if(this.y<=this.targetY){explode(this.x,this.y,this.colorObj);return true;}return false;}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fillStyle=this.colorObj.color;ctx.fill();}}
class Particle{constructor(x,y,colorObj){this.x=x;this.y=y;this.color=colorObj.color;this.speedX=(Math.random()-0.5)*6;this.speedY=(Math.random()-0.5)*6;this.life=100;}
update(){this.speedY+=gravity;this.x+=this.speedX;this.y+=this.speedY;this.life--;}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fillStyle=this.color;ctx.fill();}}

// ----------------- COLORS -----------------
function getRebirthColors(rebirthCount){
  const scheme = [{scheme:"neon", base:60},{scheme:"pastel", base:80},{scheme:"rainbow", base:100},{scheme:"galaxy", base:120}][rebirthCount%4];
  const numColors = Math.min(maxColorsPerRebirth + rebirthCount,50);
  let newColors=[];
  for(let i=0;i<numColors;i++){const hue=Math.random()*360; newColors.push({color:`hsl(${hue},${scheme.base}%,60%)`,value:i+1});}
  return newColors;
}

// ----------------- EXPLODE -----------------
function explode(x,y,colorObj){fireworkSound.currentTime=0;fireworkSound.play();
  for(let i=0;i<80;i++) particles.push(new Particle(x,y,{...colorObj}));
  money += colorObj.value*moneyMultiplier;
  document.getElementById("money").textContent=money;
  saveProgress(); saveScore();
}

// ----------------- LAUNCH -----------------
function launchFirework(x,y,auto=false){
  let colorObj;
  if(auto && unlockedColors>1){
    if(Math.random()<0.75) colorObj={...colors[unlockedColors-1]};
    else colorObj={...colors[Math.floor(Math.random()*(unlockedColors-1))]};
  }else{colorObj={...colors[Math.min(unlockedColors-1,colors.length-1)]};}
  if(moneyMultiplier>1) colorObj.color=colorObj.color.replace("60%","90%");
  fireworks.push(new Firework(x,y,colorObj));
  lastClick=Date.now();
}
document.addEventListener("click",e=>{if(Date.now()-lastClick>=clickDelay) launchFirework(e.clientX,e.clientY);});

// ----------------- LOGIN / SIGNUP -----------------
const bannedWords=["fuck","shit","bitch","ass","sex","porn","nigger","faggot","cunt","dick","crap","tit","damn"];
function normalizeName(name){return name.toLowerCase().replace(/[^a-z]/g,"");}
function isUsernameClean(name){return !bannedWords.some(word=>normalizeName(name).includes(word));}

loginBtn.addEventListener("click",()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();
  if(!email || !password){loginMsg.textContent="Enter email and password!";return;}
  auth.signInWithEmailAndPassword(email,password)
    .then(userCred=>{currentUser=userCred.user.uid;loginMsg.textContent="";showUI(false);loadProgress();})
    .catch(err=>{loginMsg.textContent=err.message;});
});

signupBtn.addEventListener("click",()=>{
  const username=document.getElementById("username").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();
  if(!username || !email || !password){loginMsg.textContent="Enter username, email and password!";return;}
  if(!isUsernameClean(username)){loginMsg.textContent="Username contains bad words!"; return;}
  auth.createUserWithEmailAndPassword(email,password)
    .then(userCred=>{
      const uid=userCred.user.uid; currentUser=uid;
      db.ref("users/"+uid).set({username,email});
      loginMsg.textContent="Account created!";
      showUI(false); saveProgress();
    })
    .catch(err=>{loginMsg.textContent=err.message;});
});

// ----------------- UI & BUTTON FUNCTIONS -----------------
function showUI(hideLogin=true){loginBox.style.display=hideLogin?"none":"block";ui.style.display=hideLogin?"block":"none";}
function updateButtons(){
  document.getElementById("buyColor").textContent=unlockedColors>=colors.length?"MAX UPGRADE":`Buy Color ($${colorPrice})`;
  document.getElementById("reduceDelay").textContent=clickDelay<=maxClickDelay?"MAX REDUCED":`Reduce Delay ($${delayPrice})`;
  document.getElementById("buyAuto").textContent=autoAmount>=maxAutoUpgrades?"MAX UPGRADE":`Buy Auto-Launch ($${autoPrice})`;
  document.getElementById("rebirth").textContent=`Rebirth ($${rebirthPrice})`;
  document.getElementById("delayDisplay").textContent=clickDelay;
  document.getElementById("autoSpeedDisplay").textContent=autoSpeed.toFixed(2);
  document.getElementById("unlockedColors").textContent=unlockedColors;
  document.getElementById("moneyMultiplier").textContent=moneyMultiplier;
}

// ----------------- PURCHASE & REBIRTH -----------------
document.getElementById("buyColor").addEventListener("click",()=>{
  if(money>=colorPrice && unlockedColors<colors.length){money-=colorPrice; unlockedColors++; colorPrice=Math.floor(colorPrice*1.7); updateButtons(); document.getElementById("money").textContent=money; saveProgress();}
});
document.getElementById("reduceDelay").addEventListener("click",()=>{
  if(money>=delayPrice && clickDelay>maxClickDelay){money-=delayPrice; clickDelay=Math.max(clickDelay-100,maxClickDelay); delayPrice=Math.floor(delayPrice*1.7); updateButtons(); document.getElementById("money").textContent=money; saveProgress();}
});
document.getElementById("rebirth").addEventListener("click",()=>{
  if(money>=rebirthPrice){
    money=0; rebirthCount++; unlockedColors=1; clickDelay=1200; moneyMultiplier++; autoAmount=0; autoSpeed=2.5; autoPrice=200;
    clearInterval(autoInterval); autoInterval=null; rebirthPrice=Math.floor(rebirthPrice*1.7); colorPrice=50; delayPrice=100;
    colors=[...baseColors,...getRebirthColors(rebirthCount)];
    updateButtons(); document.getElementById("money").textContent=money; saveProgress(); saveScore(); startAutoLaunch();
    alert("Rebirth complete! New colors unlocked and higher money multiplier!");
  }else{alert(`You need $${rebirthPrice} to rebirth!`);}
});
document.getElementById("buyAuto").addEventListener("click",()=>{
  if(autoAmount<maxAutoUpgrades && money>=autoPrice){money-=autoPrice; autoAmount++; autoSpeed/=1.2; autoPrice=Math.floor(autoPrice*1.7); document.getElementById("money").textContent=money; updateButtons(); saveProgress(); startAutoLaunch();}
});

// ----------------- AUTO-LAUNCH -----------------
function startAutoLaunch(){if(autoInterval) clearInterval(autoInterval); if(autoAmount>0){autoInterval=setInterval(()=>{launchFirework(Math.random()*canvas.width,Math.random()*canvas.height/2,true);},autoSpeed*1000);}}

// ----------------- RESET -----------------
resetBtn.addEventListener("click",()=>{
  if(confirm("Are you sure you want to reset your progress?")){
    if(currentUser) localStorage.removeItem(`firework_${currentUser}`);
    money=0; unlockedColors=1; clickDelay=1200; moneyMultiplier=1; rebirthCount=0;
    colorPrice=50; delayPrice=100; rebirthPrice=500; autoAmount=0; autoSpeed=2.5;
    clearInterval(autoInterval); autoInterval=null; colors=[...baseColors];
    updateButtons(); document.getElementById("money").textContent=money; saveProgress(); saveScore(); alert("Progress reset!");
  }
});

// ----------------- SAVE / LOAD -----------------
function saveProgress(){if(!currentUser) return; const progress={money, unlockedColors, clickDelay, moneyMultiplier, rebirthCount, rebirthPrice, colorPrice, delayPrice, autoAmount, autoSpeed}; localStorage.setItem(`firework_${currentUser}`,JSON.stringify(progress);}
function loadProgress(){if(!currentUser) return; const saved=localStorage.getItem(`firework_${currentUser}`); if(saved){const p=JSON.parse(saved); money=p.money||0; unlockedColors=p.unlockedColors||1; clickDelay=p.clickDelay||1200; moneyMultiplier=p.moneyMultiplier||1; rebirthCount=p.rebirthCount||0; rebirthPrice=p.rebirthPrice||500; colorPrice=p.colorPrice||50; delayPrice=p.delayPrice||100; autoAmount=p.autoAmount||0; autoSpeed=p.autoSpeed||2.5; colors=[...baseColors,...getRebirthColors(rebirthCount)]; updateButtons(); document.getElementById("money").textContent=money; startAutoLaunch();}}

// ----------------- FIREWORK LOOP -----------------
function animate(){
  ctx.fillStyle="rgba(0,0,0,0.2)"; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let i=fireworks.length-1;i>=0;i--){if(fireworks[i].update()) fireworks.splice(i,1); else fireworks[i].draw();}
  for(let i=particles.length-1;i>=0;i--){particles[i].update(); particles[i].draw(); if(particles[i].life<=0) particles.splice(i,1);}
  const elapsed=Date.now()-lastClick; const fill=Math.min(100,(elapsed/clickDelay)*100); document.getElementById("cooldownFill").style.width=fill+"%";
  requestAnimationFrame(animate);
}
animate();

// ----------------- LEADERBOARD -----------------
function saveScore(){if(!currentUser) return; db.ref("scores/"+currentUser).set({money});}
goLeaderboardBtn.addEventListener("click",()=>{window.open("fireworkleaderboard.html","_blank");});

// ----------------- LOADER -----------------
window.addEventListener("load",()=>{const loader=document.getElementById("loader"); setTimeout(()=>{loader.style.opacity=0; setTimeout(()=>{loader.style.display="none";},700);},1500);});

// ----------------- OWNER COMMANDS -----------------
document.getElementById("giveMoneyBtn").addEventListener("click",()=>{money+=1000; document.getElementById("money").textContent=money; saveProgress();});
document.getElementById("unlockColorsBtn").addEventListener("click",()=>{unlockedColors=colors.length; updateButtons(); saveProgress();});
document.getElementById("maxAutoBtn").addEventListener("click",()=>{autoAmount=maxAutoUpgrades; autoSpeed=0.1; updateButtons(); startAutoLaunch(); saveProgress();});
document.getElementById("viewUsersBtn").addEventListener("click",()=>{
  const users=JSON.parse(localStorage.getItem("all_users")||"[]");
  alert("Registered users:\n\n"+users.join("\n"));
});
</script>
</body>
</html>
