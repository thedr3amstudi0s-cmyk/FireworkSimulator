<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; font-family: Arial, sans-serif; background:#000; }
canvas { display:block; background: radial-gradient(circle at bottom,#0a0a0a,#000); position: fixed; top:0; left:0; z-index:1; }

/* Login UI */
#loginBox { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#222; padding:30px; border-radius:10px; color:white; z-index:200; }
#loginBox input, #loginBox button { display:block; margin:8px 0; padding:10px; width:240px; border-radius:5px; border:none; }
#loginBox button { background:cyan; color:black; font-weight:bold; cursor:pointer; }
#loginBox button:hover { background:#0ff; }

/* Game UI */
#ui{position:fixed; top:10px; left:10px; color:white; z-index:100; display:none;}
#ui button{margin:2px; padding:5px 8px; font-size:14px; cursor:pointer;}
#ownerCommands{margin-top:8px; display:none;}
#cooldownBar{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:280px; height:18px; background:rgba(255,255,255,0.25); border-radius:9px;}
#cooldownFill{height:100%; width:0%; background:limegreen; transition:width 0.05s;}
#resetBtn{position:fixed; top:10px; right:10px; padding:5px 8px; background:red; color:white; border:none; border-radius:5px; display:none;}
#eventBanner {
  display:none; position:fixed; top:12px; left:50%; transform:translateX(-50%);
  background:linear-gradient(90deg,#ff6,#6ff); color:black; padding:8px 14px;
  border-radius:10px; font-weight:bold; z-index:9999; box-shadow:0 0 20px rgba(0,0,0,0.6);
  text-align:center; min-width:220px;
}
body, button, input, p, span { user-select: none; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="loginBox">
  <h2 style="text-align:center;color:#0ff;">Firework Simulator</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <button id="forgotBtn" style="background:#444;color:white;">Forgot Password?</button>
  <p id="loginMsg" style="color:yellow;"></p>
</div>

<div id="ui">
  <h2>Money: $<span id="money">0</span></h2>
  <button id="buyColor">Buy Color ($<span id="colorPrice">50</span>)</button>
  <button id="reduceDelay">Reduce Delay ($<span id="delayPrice">100</span>)</button>
  <button id="rebirth">Rebirth ($<span id="rebirthPrice">500</span>)</button>
  <button id="buyAuto">Buy Auto-Launch ($<span id="autoPrice">200</span>)</button>
  <button id="goLeaderboardBtn">Open Leaderboard</button>
  <p>Unlocked Colors: <span id="unlockedColors">1</span></p>
  <p>Click Delay: <span id="delayDisplay">1200</span> ms</p>
  <p>Firework Money Multiplier: x<span id="moneyMultiplier">1</span></p>
  <p>Auto Speed: <span id="autoSpeedDisplay">2.50</span> sec</p>
  <div id="ownerCommands"><h3>Admin</h3>
    <button id="giveMoneyBtn">Give $10000</button>
    <button id="unlockColorsBtn">Unlock All Colors</button>
    <button id="maxAutoBtn">Max Auto-Launch</button>
    <button id="toggleDouble">Toggle Double Money</button>
    <button id="toggleRainbow">Toggle Rainbow Mode</button>
    <button id="toggleChain">Toggle Chain Reaction</button>
    <button id="toggleCosmic">Toggle Cosmic Mode</button>
    <button id="toggleLucky">Toggle Lucky Explosions</button>
    <button id="toggleChaos">Toggle Chaos Roll</button>
    <button id="triggerAdminStorm">Trigger Admin Storm</button>
    <button id="toggleBlackout">Toggle Blackout</button>
    <button id="toggleGlitch">Toggle Glitch Event</button>
    <button id="adminAnnounce">Global Announcement</button>
    <p style="font-size:12px;color:#ccc;">(Owner-only controls)</p>
  </div>
</div>

<div id="eventBanner">
  <div id="eventName"></div>
  <div id="eventDesc" style="font-size:12px;margin-top:6px;"></div>
  <div id="eventTimer" style="font-size:11px;margin-top:4px;color:#222;"></div>
</div>

<button id="resetBtn">Reset Progress</button>
<button id="logoutBtn" style="position:fixed; top:50px; right:10px; padding:5px 8px; background:orange; color:white; border:none; border-radius:5px;">Logout</button>
<div id="cooldownBar"><div id="cooldownFill"></div></div>
<audio id="fireworkSound" src="assets/single-firework-79814.mp3"></audio>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<!-- Game logic -->
<script src="game.js"></script>

</body>
</html>
