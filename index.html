<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; font-family: Arial, sans-serif; background:#000; }
canvas {
  display: block;
  background: radial-gradient(circle at bottom, #0a0a0a, #000);
  position: fixed; /* keep canvas fixed */
  top: 0;
  left: 0;
  z-index: 1;      /* make canvas behind UI buttons */
}


/* Login UI */
#loginBox { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#222; padding:30px; border-radius:10px; color:white; z-index:200;}
#loginBox input, #loginBox button { display:block; margin:8px 0; padding:10px; width:240px; border-radius:5px; border:none; }
#loginBox button { background:cyan; color:black; font-weight:bold; cursor:pointer; }
#loginBox button:hover { background:#0ff; }

/* Game UI */
#ui{position:fixed; top:10px; left:10px; color:white; z-index:100;}
#ui button{margin:2px; padding:5px 8px; font-size:14px; cursor:pointer;}
#ownerCommands{margin-top:8px; display:none;}
#cooldownBar{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:280px; height:18px; background:rgba(255,255,255,0.25); border-radius:9px;}
#cooldownFill{height:100%; width:0%; background:limegreen; transition:width 0.05s;}
#resetBtn{position:fixed; top:10px; right:10px; padding:5px 8px; background:red; color:white; border:none; border-radius:5px; display:none;}
#eventBanner {
  display:none;
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#ff6,#6ff);
  color:black;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
  z-index:9999;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
  text-align:center;
  min-width:220px;
}
body, button, input, p, span { user-select: none; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="loginBox">
  <h2 style="text-align:center;color:#0ff;">Firework Simulator</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <button id="forgotBtn" style="background:#444;color:white;">Forgot Password?</button>
  <p id="loginMsg" style="color:yellow;"></p>
</div>

<div id="ui" style="display:none;">
  <h2>Money: $<span id="money">0</span></h2>
  <button id="buyColor">Buy Color ($<span id="colorPrice">50</span>)</button>
  <button id="reduceDelay">Reduce Delay ($<span id="delayPrice">100</span>)</button>
  <button id="rebirth">Rebirth ($<span id="rebirthPrice">500</span>)</button>
  <button id="buyAuto">Buy Auto-Launch ($<span id="autoPrice">200</span>)</button>
  <button id="goLeaderboardBtn">Open Leaderboard</button>
  <p>Unlocked Colors: <span id="unlockedColors">1</span></p>
  <p>Click Delay: <span id="delayDisplay">1200</span> ms</p>
  <p>Firework Money Multiplier: x<span id="moneyMultiplier">1</span></p>
  <p>Auto Speed: <span id="autoSpeedDisplay">2.50</span> sec</p>
  <div id="ownerCommands"><h3>Admin</h3>
    <button id="giveMoneyBtn">Give $10000</button>
    <button id="unlockColorsBtn">Unlock All Colors</button>
    <button id="maxAutoBtn">Max Auto-Launch</button>
    <button id="toggleDouble">Toggle Double Money</button>
    <button id="toggleRainbow">Toggle Rainbow Mode</button>
    <button id="toggleChain">Toggle Chain Reaction</button>
    <button id="toggleCosmic">Toggle Cosmic Mode</button>
    <button id="toggleLucky">Toggle Lucky Explosions</button>
    <button id="toggleChaos">Toggle Chaos Roll</button>
    <button id="triggerAdminStorm">Trigger Admin Storm</button>
    <button id="toggleBlackout">Toggle Blackout</button>
    <button id="toggleGlitch">Toggle Glitch Event</button>
    <button id="adminAnnounce">Global Announcement</button>
    <p style="font-size:12px;color:#ccc;">(Owner-only controls)</p>
  </div>
</div>

<div id="eventBanner">
  <div id="eventName"></div>
  <div id="eventDesc" style="font-size:12px;margin-top:6px;"></div>
  <div id="eventTimer" style="font-size:11px;margin-top:4px;color:#222;"></div>
</div>

<button id="resetBtn">Reset Progress</button>
<button id="logoutBtn" style="position:fixed; top:50px; right:10px; padding:5px 8px; background:orange; color:white; border:none; border-radius:5px;">Logout</button>
<div id="cooldownBar"><div id="cooldownFill"></div></div>
<audio id="fireworkSound" src="assets/single-firework-79814.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// -------- FIREBASE CONFIG --------
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1",
  measurementId: "G-H07BZY385S"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// -------- GLOBAL VARIABLES & UI HANDLES --------
const loginBox = document.getElementById("loginBox");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const loginMsg = document.getElementById("loginMsg");
const ui = document.getElementById("ui");
const resetBtn = document.getElementById("resetBtn");
const ownerCommands = document.getElementById("ownerCommands");
const goLeaderboardBtn = document.getElementById("goLeaderboardBtn");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const eventBanner = document.getElementById("eventBanner");
const eventNameEl = document.getElementById("eventName");
const eventDescEl = document.getElementById("eventDesc");
const eventTimerEl = document.getElementById("eventTimer");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener("resize",()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight;});

let currentUser="";
let money=0, unlockedColors=1, clickDelay=1200, lastClick=Date.now(), rebirthCount=0;
let colorPrice=50, delayPrice=100, rebirthPrice=500, autoPrice=200, autoAmount=0, autoSpeed=2.5;
let fireworks=[], particles=[];
let gravity=0.04;
const fireworkSound=document.getElementById("fireworkSound");
let autoInterval=null;

// Base colors
const baseColors=[
  {color:"hsl(0,100%,60%)", value:1},
  {color:"hsl(30,100%,60%)", value:2},
  {color:"hsl(60,100%,60%)", value:3},
  {color:"hsl(120,100%,60%)", value:4},
  {color:"hsl(180,100%,60%)", value:5},
  {color:"hsl(240,100%,60%)", value:6}
];
let colors=[...baseColors];

// -------- EVENTS STATE --------
let EVENTS_STATE = {
  active: false,
  // toggles
  chainReaction: false,
  doubleMoney: false,
  rainbowMode: false,
  cosmicMode: false,
  luckyExplosions: false,
  chaosRoll: false,
  goldenFirework: false, // passive rare spawn
  adminStorm: false,
  blackout: false,
  glitch: false,
  // meta
  name: "",
  description: "",
  endsAt: null
};

let eventIntervalHandles = []; // for timers etc.

// ---------- Helper: show banner ----------
function showEventBanner(name, desc, endsAt){
  eventNameEl.textContent = name;
  eventDescEl.textContent = desc || "";
  if(!endsAt){
    eventTimerEl.textContent = "";
  } else {
    const update = ()=>{
      const left = Math.max(0, endsAt - Date.now());
      if(left<=0){
        eventTimerEl.textContent = "Ending...";
        return;
      }
      eventTimerEl.textContent = "Ends in " + Math.ceil(left/1000) + "s";
    };
    update();
    const id = setInterval(update,1000);
    eventIntervalHandles.push(id);
  }
  eventBanner.style.display = "block";
}
function hideEventBanner(){
  eventBanner.style.display = "none";
  eventNameEl.textContent = "";
  eventDescEl.textContent = "";
  eventTimerEl.textContent = "";
  // clear timers
  eventIntervalHandles.forEach(i=>clearInterval(i));
  eventIntervalHandles = [];
}

// -------- AUTH & LOGIN --------
auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user.uid;
    loginBox.style.display = "none";
    ui.style.display = "block";
    resetBtn.style.display = "block";
    // owner check - change to your email or uid if needed
    ownerCommands.style.display = (user.email === "aaron.gatorfan@gmail.com" || user.uid === "ADMIN_UID_OR_EMAIL") ? "block" : "none";
    await loadProgressOnline();
  } else {
    // not logged in
    currentUser = "";
    loginBox.style.display = "block";
    ui.style.display = "none";
    resetBtn.style.display = "none";
  }
});

// Forgot Password
document.getElementById("forgotBtn").addEventListener("click",()=>{
  const email=document.getElementById("email").value.trim();
  if(!email){ loginMsg.textContent="Enter email!"; return; }
  auth.sendPasswordResetEmail(email)
    .then(()=>loginMsg.textContent="Password reset email sent!")
    .catch(err=>loginMsg.textContent=err.message);
});

// Login
loginBtn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value.trim();
  loginMsg.style.color = "yellow";
  if (!email || !pass) { loginMsg.textContent = "Enter email & password!"; return; }
  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    currentUser = cred.user.uid;
    loginMsg.textContent = "";
    loginBox.style.display = "none";
    ui.style.display = "block";
    resetBtn.style.display = "block";
    ownerCommands.style.display = (cred.user.email === "aaron.gatorfan@gmail.com" || cred.user.uid === "ADMIN_UID_OR_EMAIL") ? "block" : "none";
    await loadProgressOnline();
  } catch(err){ loginMsg.textContent = err.message; }
});

// Signup
signupBtn.addEventListener("click", async () => {
  const uname = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value.trim();
  loginMsg.style.color = "yellow";
  if (!uname || !email || !pass) { loginMsg.textContent = "Enter all fields!"; return; }
  if (pass.length < 6) { loginMsg.textContent = "Password must be at least 6 characters!"; return; }
  if (!/^[a-zA-Z0-9_]{3,16}$/.test(uname)) { loginMsg.textContent = "Username must be 3-16 characters (letters, numbers, _)"; return; }
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    currentUser = cred.user.uid;
    // Save username to /users (as requested earlier)
    await db.ref("users/" + currentUser).set({ username: uname });
    loginMsg.style.color = "lime";
    loginMsg.textContent = "Account created!";
    loginBox.style.display = "none"; ui.style.display = "block"; resetBtn.style.display = "block";
    await saveProgressOnline();
    ownerCommands.style.display = (cred.user.email === "aaron.gatorfan@gmail.com" || cred.user.uid === "ADMIN_UID_OR_EMAIL") ? "block" : "none";
  } catch(err){ loginMsg.style.color = "red"; loginMsg.textContent = err.message; }
});

// -------- FIREWORK CLASSES --------
class Firework{constructor(x,y,colorObj,owner=false){this.x=x;this.y=canvas.height;this.targetY=y;this.speed=Math.random()*2+4;this.colorObj=colorObj;this.owner=owner;}
update(){this.y-=this.speed;if(this.y<=this.targetY){explode(this.x,this.y,this.colorObj,this.owner);return true;}return false;}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fillStyle=this.colorObj.color;ctx.fill();}}
class Particle{constructor(x,y,colorObj){this.x=x;this.y=y;this.color=colorObj.color;this.speedX=(Math.random()-0.5)*6;this.speedY=(Math.random()-0.5)*6;this.life=100;}
update(){this.speedY+=gravity;this.x+=this.speedX;this.y+=this.speedY;this.life--;}
draw(){ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fillStyle=this.color;ctx.fill();}}

// -------- EVENT HANDLING (listen to /events) --------
db.ref("events").on("value", snap => {
  const e = snap.val();
  // reset eventIntervalHandles
  eventIntervalHandles.forEach(i=>clearInterval(i));
  eventIntervalHandles = [];

  if (!e || !e.active) {
    EVENTS_STATE = {...EVENTS_STATE, active:false, chainReaction:false, doubleMoney:false, rainbowMode:false, cosmicMode:false, luckyExplosions:false, chaosRoll:false, goldenFirework:false, adminStorm:false, blackout:false, glitch:false, name:"", description:"", endsAt:null};
    hideEventBanner();
    return;
  }

  EVENTS_STATE.active = true;
  EVENTS_STATE.chainReaction = !!e.chainReaction;
  EVENTS_STATE.doubleMoney = !!e.doubleMoney;
  EVENTS_STATE.rainbowMode = !!e.rainbowMode;
  EVENTS_STATE.cosmicMode = !!e.cosmicMode;
  EVENTS_STATE.luckyExplosions = !!e.luckyExplosions;
  EVENTS_STATE.chaosRoll = !!e.chaosRoll;
  EVENTS_STATE.goldenFirework = !!e.goldenFirework;
  EVENTS_STATE.adminStorm = !!e.adminStorm;
  EVENTS_STATE.blackout = !!e.blackout;
  EVENTS_STATE.glitch = !!e.glitch;

  EVENTS_STATE.name = e.name || "Event Active";
  EVENTS_STATE.description = e.description || "";
  EVENTS_STATE.endsAt = e.endsAt || null;

  // show banner
  showEventBanner(EVENTS_STATE.name, EVENTS_STATE.description, EVENTS_STATE.endsAt);

  // admin storm: if active, spawn random launches for this client for the duration
  if (EVENTS_STATE.adminStorm && !e.adminStormExpiresHandled) {
    // set a short-lived storm if endsAt present
    const duration = Math.max(5000, (EVENTS_STATE.endsAt ? EVENTS_STATE.endsAt - Date.now() : 20000));
    const stormInterval = setInterval(()=>{
      // spawn a few random fireworks (they give normal rewards)
      for(let i=0;i<3;i++){
        launchFirework(Math.random()*canvas.width, Math.random()*canvas.height/2);
      }
    }, 800);
    eventIntervalHandles.push(stormInterval);
  }

  // glitch effect: apply altered gravity periodically
  if (EVENTS_STATE.glitch) {
    const glitchInterval = setInterval(()=> {
      gravity = (Math.random()*0.3)-0.1; // -0.1 .. 0.2
      setTimeout(()=>{ gravity = 0.04; }, 800);
    }, 2000);
    eventIntervalHandles.push(glitchInterval);
  }
});

// -------- CORE: award money with multipliers & chain reaction --------
function awardAndSave(amount){
  // clamp sanity
  if (!Number.isFinite(amount)) return;
  if (amount < 0) amount = 0;
  money += Math.floor(amount);
  document.getElementById("money").textContent = money;
  saveProgressOnline();
  saveScore();
}

// chain reaction helper (recursively spawn children and award)
function doChainReaction(baseValue, level=1, maxLevel=2){
  if (!EVENTS_STATE.chainReaction || level > maxLevel) return;
  // for each parent spawn 2 children
  const numChildren = 2;
  for(let i=0;i<numChildren;i++){
    // small explosion reward is ceil(parent / 2)
    const childBase = Math.ceil(baseValue / 2);
    // apply same multipliers to child as to parent (we will call computeAndAward with isChild flag)
    computeAndAward(childBase, true, level+1);
    // spawn tiny particles visually
    for(let p=0;p<20;p++) particles.push(new Particle((Math.random()*100)+canvas.width/2, (Math.random()*canvas.height/2), {color:"hsl("+(Math.random()*360)+",100%,60%)"}));
  }
}

// computeAndAward(base, isChild=false, chainLevel=1)
function computeAndAward(baseMoney, isChild=false, chainLevel=1){
  // baseMoney is integer
  const base = Math.max(0, Math.floor(baseMoney));

  // 1) Chain reaction: if enabled and chaos roll doesn't override, spawn chain extras
  // (we'll spawn children AFTER computing multipliers so order remains predictable)
  // 2) Chaos Roll override
  let chaosMultiplier = 1;
  let triggeredChainFromChaos = false;
  if (EVENTS_STATE.chaosRoll && Math.random() < 1) {
    // pick random outcome with weighting: [0.5, 1, 2, 5, chain]
    const choices = ["0.5","1","2","5","chain"];
    const pick = choices[Math.floor(Math.random()*choices.length)];
    if (pick === "chain") {
      triggeredChainFromChaos = true;
    } else {
      chaosMultiplier = parseFloat(pick);
    }
  }

  // 3) Golden Firework (rare)
  let goldenMultiplier = 1;
  if (EVENTS_STATE.goldenFirework && Math.random() < 0.01) {
    goldenMultiplier = 10;
    // visual cue can be handled by using special color
  }

  // 4) Lucky Explosions
  let luckyMultiplier = 1;
  if (EVENTS_STATE.luckyExplosions && Math.random() < 0.10) {
    luckyMultiplier = 4;
  }

  // 5) Cosmic Mode
  let cosmicMultiplier = EVENTS_STATE.cosmicMode ? 2 : 1;

  // 6) Double Money
  let doubleMultiplier = EVENTS_STATE.doubleMoney ? 2 : 1;

  // 7) Rainbow Mode
  let rainbowMultiplier = EVENTS_STATE.rainbowMode ? 5 : 1;

  // 8) Blackout
  let blackoutMultiplier = EVENTS_STATE.blackout ? 3 : 1;

  // 9) Glitch random multiplier (0..3)
  let glitchMultiplier = 1;
  if (EVENTS_STATE.glitch) {
    glitchMultiplier = Math.random()*3; // 0..3
  }

  // Final multiplier composition (order: chaos -> lucky -> golden -> cosmic -> double -> rainbow -> blackout -> glitch)
  const finalMultiplier = chaosMultiplier * luckyMultiplier * goldenMultiplier * cosmicMultiplier * doubleMultiplier * rainbowMultiplier * blackoutMultiplier * glitchMultiplier;

  // final award
  const awarded = Math.round(base * finalMultiplier);

  // award to player
  awardAndSave(awarded);

  // if chain reaction active (or triggered by chaos), spawn child explosions:
  if ((EVENTS_STATE.chainReaction && !isChild) || triggeredChainFromChaos) {
    // spawn children based on base (not awarded)
    doChainReaction(base, chainLevel, 2);
  }

  // Visual: golden or lucky flash
  if (goldenMultiplier > 1) {
    flashScreen("#ffd700", 200);
  } else if (luckyMultiplier > 1) {
    flashScreen("#00ff00", 150);
  }
}

// simple screen flash (visual)
function flashScreen(color, duration=150){
  const old = ctx.fillStyle;
  ctx.fillStyle = color;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  setTimeout(()=>{}, duration); // just for timing, main loop will repaint
}

// -------- EXPLOSIONS & LAUNCH --------
function explode(x,y,colorObj, ownerFlag=false){
  fireworkSound.currentTime=0; fireworkSound.play();

  // visual particles
  for(let i=0;i<80;i++) particles.push(new Particle(x,y,colorObj));

  // Determine color override if Rainbow mode
  if (EVENTS_STATE.rainbowMode) {
    colorObj = { color: `hsl(${Math.floor(Math.random()*360)},100%,60%)`, value: colorObj.value };
  }

  // base money (before multipliers)
  const base = colorObj.value * (rebirthCount + 1);

  // Compute & award (handles chain, chaos, lucky, golden, etc)
  computeAndAward(base, false, 1);
}

// launch firework (player)
function launchFirework(x,y){
  const colorIndex = Math.floor(Math.random() * unlockedColors);
  const colorObj = colors[colorIndex];
  fireworks.push(new Firework(x,y,colorObj,true));
  lastClick = Date.now();
}

document.addEventListener("click",e=>{
  const now = Date.now();
  if (now - lastClick >= clickDelay) {
    lastClick = now;
    launchFirework(e.clientX,e.clientY);
  } else {
    // click too fast - ignore
  }
});

// -------- ANIMATE --------
function animate(){
  // Blackout visual: darken sky more
  if (EVENTS_STATE.blackout) {
    ctx.fillStyle="rgba(0,0,0,0.98)";
  } else {
    ctx.fillStyle="rgba(0,0,0,0.2)";
  }
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // visual event glow if double money or rainbow
  if (EVENTS_STATE.doubleMoney) {
    ctx.shadowBlur = 12; ctx.shadowColor = "#ff0";
  } else if (EVENTS_STATE.rainbowMode) {
    ctx.shadowBlur = 20; ctx.shadowColor = "#f0f";
  } else {
    ctx.shadowBlur = 0;
  }

  for(let i=fireworks.length-1;i>=0;i--){
    if(fireworks[i].update()) fireworks.splice(i,1);
    else fireworks[i].draw();
  }
  for(let i=particles.length-1;i>=0;i--){
    particles[i].update(); particles[i].draw();
    if(particles[i].life<=0) particles.splice(i,1);
  }
  const elapsed=Date.now()-lastClick; const fill=Math.min(100,(elapsed/clickDelay)*100);
  document.getElementById("cooldownFill").style.width=fill+"%";
  document.getElementById("moneyMultiplier").textContent=(rebirthCount+1);
  requestAnimationFrame(animate);
}
animate();

// -------- ONLINE SAVE/LOAD (safe) --------
async function saveProgressOnline(){
  if(!currentUser) return;

  // Basic client-side sanity checks (makes casual cheating harder)
  if (!Number.isFinite(money) || money < 0) money = Math.max(0, Math.floor(money));
  if (money > 1000000000) money = 1000000000;
  if (clickDelay < 100) clickDelay = 100;
  if (unlockedColors > colors.length) unlockedColors = colors.length;
  if (rebirthCount < 0) rebirthCount = 0;
  if (autoAmount < 0) autoAmount = 0;
  if (autoAmount > 3) autoAmount = 3;

  const progress = { money, unlockedColors, clickDelay, rebirthCount, rebirthPrice, colorPrice, delayPrice, autoAmount, autoSpeed };
  await db.ref("progress/" + currentUser).set(progress);
}

async function loadProgressOnline(){
  if(!currentUser) return;
  const snap = await db.ref("progress/" + currentUser).once("value");
  const p = snap.val();
  if(p){
    money = p.money || 0;
    unlockedColors = p.unlockedColors || 1;
    clickDelay = p.clickDelay || 1200;
    rebirthCount = p.rebirthCount || 0;
    rebirthPrice = p.rebirthPrice || 500;
    colorPrice = p.colorPrice || 50;
    delayPrice = p.delayPrice || 100;
    autoAmount = p.autoAmount || 0;
    autoSpeed = p.autoSpeed || 2.5;
    colors = [...baseColors, ...getRebirthColors(rebirthCount)];
    if(unlockedColors>colors.length) unlockedColors=colors.length;
    document.getElementById("money").textContent = money;
    updateButtons();
    startAutoLaunch();
  }
}

// -------- BUTTONS & UPGRADES (same as your old logic) --------
function updateButtons(){
  document.getElementById("buyColor").textContent = unlockedColors >= colors.length ? "MAX" : `Buy Color ($${colorPrice})`;
  document.getElementById("reduceDelay").textContent = clickDelay <= 100 ? "MAX" : `Reduce Delay ($${delayPrice})`;
  document.getElementById("buyAuto").textContent = autoAmount >= 3 ? "MAX" : `Buy Auto-Launch ($${autoPrice})`;
  document.getElementById("rebirth").textContent = `Rebirth ($${rebirthPrice})`;
  document.getElementById("delayDisplay").textContent = clickDelay;
  document.getElementById("autoSpeedDisplay").textContent = autoSpeed.toFixed(2);
  document.getElementById("unlockedColors").textContent = unlockedColors;
}

document.getElementById("buyColor").addEventListener("click",()=>{
  if(money>=colorPrice && unlockedColors<colors.length){money-=colorPrice; unlockedColors++; colorPrice=Math.floor(colorPrice*1.7); updateButtons(); document.getElementById("money").textContent=money; saveProgressOnline();}
});
document.getElementById("reduceDelay").addEventListener("click",()=>{
  if(money>=delayPrice && clickDelay>100){money-=delayPrice; clickDelay=Math.max(clickDelay-100,100); delayPrice=Math.floor(delayPrice*1.7); updateButtons(); document.getElementById("money").textContent=money; saveProgressOnline();}
});
document.getElementById("buyAuto").addEventListener("click",()=>{
  if(autoAmount<3 && money>=autoPrice){money-=autoPrice; autoAmount++; autoSpeed/=1.2; autoPrice=Math.floor(autoPrice*1.7); document.getElementById("money").textContent=money; updateButtons(); saveProgressOnline(); startAutoLaunch();}
});

document.getElementById("rebirth").addEventListener("click", async () => {
  if (money >= rebirthPrice) {
    money=0; rebirthCount++; unlockedColors=1; clickDelay=1200;
    autoAmount=0; autoSpeed=2.5; autoPrice=200; clearInterval(autoInterval); autoInterval=null;
    colorPrice=50; delayPrice=100; rebirthPrice=Math.floor(rebirthPrice*1.7);
    colors=[...baseColors, ...getRebirthColors(rebirthCount)];
    updateButtons(); document.getElementById("money").textContent=money;
    await saveProgressOnline(); saveScore();
    startAutoLaunch();
    alert("Rebirth complete!");
  } else alert(`Need $${rebirthPrice} to rebirth!`);
});

resetBtn.addEventListener("click", async ()=>{
  if(confirm("Reset progress?")){
    money=0; unlockedColors=1; clickDelay=1200; rebirthCount=0;
    colorPrice=50; delayPrice=100; rebirthPrice=500; autoAmount=0; autoSpeed=2.5;
    clearInterval(autoInterval); autoInterval=null; colors=[...baseColors];
    updateButtons(); document.getElementById("money").textContent=money; await saveProgressOnline(); saveScore(); alert("Progress reset!");
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  if (confirm("Are you sure you want to log out?")) {
    auth.signOut().then(() => {
      loginBox.style.display = "block";
      ui.style.display = "none";
      resetBtn.style.display = "none";
      ownerCommands.style.display = "none";
      currentUser = "";
      money = 0; unlockedColors = 1; clickDelay = 1200; rebirthCount = 0; autoAmount = 0; autoSpeed = 2.5;
      clearInterval(autoInterval); autoInterval = null;
      document.getElementById("money").textContent = "0";
      document.getElementById("unlockedColors").textContent = "1";
      document.getElementById("moneyMultiplier").textContent = "1";
      document.getElementById("delayDisplay").textContent = "1200";
      document.getElementById("autoSpeedDisplay").textContent = "2.50";
      alert("You have been logged out!");
    }).catch(err => { alert("Error logging out: " + err.message); });
  }
});

function startAutoLaunch(){
  if(autoInterval) clearInterval(autoInterval);
  if(autoAmount>0) autoInterval=setInterval(()=>{launchFirework(Math.random()*canvas.width,Math.random()*canvas.height/2);},autoSpeed*1000);
}

// -------- SAFE LEADERBOARD (unchanged) --------
function saveScore(){
  if(!currentUser) return;
  const scoreRef = db.ref("scores/"+currentUser);
  scoreRef.once("value").then(snapshot=>{
    const oldMoney = snapshot.val()?.money || 0;
    const newMoney = Math.max(oldMoney, money);
    scoreRef.set({ money: newMoney });
  }).catch(err=>console.error("Error saving score:", err));
}

async function setEventPayload(payload){
  await db.ref("events").set(payload);
}
async function toggleEventFlag(flag){
  const snap = await db.ref("events").once("value");
  const cur = snap.val() || {};
  cur[flag] = !cur[flag];
  cur.active = Object.values({ ...cur }).some(v => v === true || (typeof v === "object" && v.active)); // keep active if anything true
  await db.ref("events").set(cur);
}
