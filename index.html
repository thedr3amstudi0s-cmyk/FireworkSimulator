<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Firework Simulator</title>
<style>
  html,body { margin:0; padding:0; height:100%; background:#000; font-family:Arial, sans-serif; }
  canvas { display:block; width:100%; height:100%; background: radial-gradient(circle at bottom,#0a0a0a,#000); }

  #loginBox { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
     background:#222; padding:28px; border-radius:10px; color:white; z-index:200; width:280px; }
  #loginBox input, #loginBox button { display:block; margin:8px 0; padding:10px; width:100%; border-radius:6px; border:none; box-sizing:border-box; }
  #loginBox button { background:cyan; color:#000; cursor:pointer; font-weight:700; }
  #loginBox button:hover{ filter:brightness(1.05); }

  #ui { position:fixed; top:10px; left:10px; color:white; z-index:150; }
  #ui h2{ margin:0 0 8px 0; color:#fff; font-size:18px; }
  #ui button { margin:4px 4px 4px 0; padding:6px 8px; border-radius:6px; border:none; cursor:pointer; }
  #ownerCommands{ margin-top:8px; display:none; background:rgba(255,255,255,0.03); padding:6px; border-radius:6px; }
  #cooldownBar{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:280px; height:18px; background:rgba(255,255,255,0.12); border-radius:9px; z-index:160; }
  #cooldownFill{ height:100%; width:0%; background:limegreen; border-radius:8px; transition:width 0.05s; }
  #resetBtn { position:fixed; top:10px; right:10px; padding:6px 8px; background:#c0392b; color:white; border:none; border-radius:6px; display:none; z-index:150; }
  #logoutBtn { position:fixed; top:50px; right:10px; padding:6px 8px; background:orange; color:white; border:none; border-radius:6px; z-index:150; }
  #notifications { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:300; color:#0ff; font-weight:700; text-shadow:0 0 6px rgba(0,0,0,0.8); pointer-events:none; }

  #ui p { margin:6px 0; font-size:13px; color:#ddd; }
  #tagInventory { margin-top:10px; background:rgba(255,255,255,0.02); padding:8px; border-radius:8px; max-width:320px; }
  #tagInventory h4 { margin:0 0 6px 0; color:#fff; font-size:14px; }
  #tagInventory .tagRow { margin:6px 0; font-size:13px; color:#ddd; }
  #tagInventory .tagName { color:#0ff; font-weight:700; margin-right:6px; }
  #tagInventory .tagDesc { color:#aaa; font-style:italic; display:block; margin-top:2px; }

  .tag-owner .tagName { color: gold; }
  .tag-vip .tagName { color: cyan; }
  .tag-donator .tagName { color: green; }
  .tag-streamer .tagName { color: magenta; } 
  .tag-youtuber .tagName { color: red; }
  .tag-regular .tagName { color: white; }
  .tag-fart .tagName { color: magenta; }
  .tag-mystery .tagName { color: black; }

  #muteBtn {position:fixed; top:90px; right:10px; padding:6px 8px; background:#444; color:white; font-weight:600; border:none;}
  #muteBtn.muted {background:#c0392b;}
  
  #goGoogleForm {position:fixed; top:130px; right:10px; padding:6px 8px; background:#444; color:white; font-weight:600; border:none;}

  @keyframes glitch {
  0% { transform: translate(0,0); filter: hue-rotate(0deg); }
  20% { transform: translate(-2px,2px); }
  40% { transform: translate(2px,-2px); filter: hue-rotate(90deg); }
  60% { transform: translate(-2px,-1px); }
  80% { transform: translate(1px,2px); filter: hue-rotate(180deg); }
  100% { transform: translate(0,0); }
}

.glitch-ui button {
  animation: glitch 0.15s infinite;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="loginBox">
  <input id="username" placeholder="Username (3-16 chars, optional on login)"/>
  <input id="email" type="email" placeholder="Email"/>
  <input id="password" type="password" placeholder="Password"/>
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <button id="forgotBtn" style="background:#444;color:white;">Forgot Password?</button>
  <p id="loginMsg" style="color:yellow; margin:6px 0 0 0; font-size:13px;"></p>
</div>

<div id="ui" style="display:none;">
  <h2>Money: $<span id="money">0</span></h2>

  <div>
    <button id="buyColor">Buy Color ($<span id="colorPrice">50</span>)</button>
    <button id="reduceDelay">Reduce Delay ($<span id="delayPrice">100</span>)</button>
    <button id="rebirth">Rebirth ($<span id="rebirthPrice">500</span>)</button>
    <button id="buyAuto">Buy Auto-Launch ($<span id="autoPrice">200</span>)</button>
    <button id="goLeaderboardBtn">Open Leaderboard</button>
  </div>

  <p>Unlocked Colors: <span id="unlockedColors">1</span></p>
  <p>Click Delay: <span id="delayDisplay">1200</span> ms</p>
  <p>Firework Money Multiplier: x<span id="moneyMultiplier">1</span></p>
  <p>Auto Speed: <span id="autoSpeedDisplay">2.50</span> sec</p>

  <div id="ownerCommands">
    <strong>Owner</strong><br/>
    <button id="giveMoneyBtn">Give $1000</button>
    <button id="unlockColorsBtn">Unlock All Colors</button>
    <button id="maxAutoBtn">Max Auto-Launch</button>
    <button id="viewUsersBtn">View Users</button>
    <button id="adminFireworkBtn">Mega Firework</button>
    <button id="adminFireworkBtnNuke">NUKE</button>
    <button id="adminFireworkBtnGalaxy">Galaxy</button>
    <button id="glitchEventBtn">Glitch Event</button>
    <button id="adminMessageBtn">Send Message</button>
  </div>

  <div id="tagInventory" style="display:none;">
    <h4>Tag Inventory</h4>
    <div id="tagInventoryList"></div>
  </div>
</div>

<button id="resetBtn">Reset Progress</button>
<button id="logoutBtn">Logout</button>
<button id="muteBtn">Sound: ON</button>
<button id="goGoogleForm">Forms</button>
<div id="cooldownBar"><div id="cooldownFill"></div></div>
<div id="notifications"></div>
<audio id="fireworkSound" src="assets/single-firework-79814.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ======= FIREWORK SIMULATOR v2 =======

console.log("Script loaded");

// ---------- FIREBASE ----------
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
console.log("Firebase initialized");

// ---------- ELEMENTS ----------
const loginBox = document.getElementById('loginBox');
const loginBtn = document.getElementById('loginBtn');
const signupBtn = document.getElementById('signupBtn');
const forgotBtn = document.getElementById('forgotBtn');
const loginMsg = document.getElementById('loginMsg');
const ui = document.getElementById('ui');
const ownerCommands = document.getElementById('ownerCommands');
const resetBtn = document.getElementById('resetBtn');
const logoutBtn = document.getElementById('logoutBtn');
const notifications = document.getElementById('notifications');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fireworkSound = document.getElementById('fireworkSound');

function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ---------- GAME STATE ----------
let currentUser="", currentUsername="";
let money=0, unlockedColors=1, clickDelay=1200, lastClick=Date.now();
let rebirthCount=0, colorPrice=50, delayPrice=100, rebirthPrice=500, autoPrice=200;
let autoAmount=0, autoSpeed=2.5, fireworks=[], particles=[], autoInterval=null;
const gravity=0.04;

const baseColors=[
  { color:"hsl(0,100%,60%)", value:1},
  { color:"hsl(30,100%,60%)", value:2},
  { color:"hsl(60,100%,60%)", value:3},
  { color:"hsl(120,100%,60%)", value:4},
  { color:"hsl(180,100%,60%)", value:5},
  { color:"hsl(240,100%,60%)", value:6}
];
let colors=[...baseColors];

const ADMIN_FALLBACK = { "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true };

const TAGS_INFO = {
  owner: { name: "Owner", description: "Assigned to the owner" },
  vip: { name: "VIP", description: "Give to some supporters — can be given" },
  donator: { name: "Donator", description: "Cosmetic thank-you for supporting dr3am studi0s" },
  streamer: { name: "Streamer", description: "Given to verified streamers" },
  youtuber: { name: "Youtuber", description: "Given to verified youtubers" },
  regular: { name: "Regular", description: "Default player tag" },
  fart: { name: "Fart", description: "A tag for the fart" },
  mystery: { name: "Mystery", description: "???" }
};

let globalMultiplier = 1;
let glitchActive = false;
let lastAdminTimestamp=0;

// ---------- NOTIFICATIONS ----------
function showNotification(text,time=2500){
  notifications.textContent=text;
  notifications.style.opacity='1';
  setTimeout(()=>{ notifications.style.opacity='0'; },time);
}

// ---------- FIREWORK CLASSES ----------
class Firework {
  constructor(x, y, colorObj) {
    this.x = x; this.y = canvas.height; this.targetY = y;
    this.speed = Math.random() * 2 + 4; this.colorObj = colorObj;
    this.exploded = false;
  }
  update() {
    if (glitchActive) { this.x += (Math.random()-0.5)*6; this.y += (Math.random()-0.5)*6; }
    this.y -= this.speed;
    if (this.y <= this.targetY && !this.exploded) { this.exploded=true; explode(this.x,this.y,this.colorObj); return true; }
    return false;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x,this.y,2,0,Math.PI*2);
    ctx.fillStyle = glitchActive ? `hsl(${Math.random()*360},100%,60%)` : this.colorObj.color;
    ctx.fill();
  }
}

class Particle {
  constructor(x,y,colorObj) { this.x=x; this.y=y; this.color=colorObj.color; this.vx=(Math.random()-0.5)*6; this.vy=(Math.random()-0.5)*6; this.life=100; }
  update() { this.vy+=gravity; this.x+=this.vx; this.y+=this.vy; this.life--; }
  draw() { ctx.beginPath(); ctx.arc(this.x,this.y,2,0,Math.PI*2); ctx.fillStyle = glitchActive ? `hsl(${Math.random()*360},100%,60%)` : this.color; ctx.fill(); }
}

let soundMuted=false;
const muteBtn=document.getElementById('muteBtn');
muteBtn.addEventListener('click',()=>{
  soundMuted=!soundMuted; fireworkSound.muted=soundMuted;
  muteBtn.textContent = soundMuted?'Sound: OFF':'Sound: ON';
  muteBtn.classList.toggle('muted',soundMuted);
  showNotification(soundMuted?'Game sound muted':'Game sound on');
});

// ---------- CORE FUNCTIONS ----------
function explode(x,y,colorObj){
  if(!soundMuted){ try{ fireworkSound.currentTime=0; fireworkSound.play(); } catch(e){} }
  for(let i=0;i<80;i++) particles.push(new Particle(x,y,colorObj));
  money += colorObj.value*(rebirthCount+1)*globalMultiplier;
  document.getElementById('money').textContent=money;
  saveProgressOnline().catch(()=>{console.log('save failed');});
}

function launchFirework(x,y){
  if(colors.length===0) colors=[...baseColors];
  const max=Math.min(unlockedColors,colors.length);
  const colorIndex=Math.floor(Math.random()*Math.max(1,max));
  const colorObj=colors[colorIndex];
  fireworks.push(new Firework(x,y,colorObj));
  lastClick=Date.now();
}

document.addEventListener('click',(e)=>{ if(Date.now()-lastClick>=clickDelay) launchFirework(e.clientX,e.clientY); });

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i=fireworks.length-1;i>=0;i--){ if(fireworks[i].update()) fireworks.splice(i,1); else fireworks[i].draw(); }
  for(let i=particles.length-1;i>=0;i--){ particles[i].update(); particles[i].draw(); if(particles[i].life<=0) particles.splice(i,1); }

  const elapsed=Date.now()-lastClick;
  const pct=Math.min(100,(elapsed/clickDelay)*100);
  document.getElementById('cooldownFill').style.width=pct+'%';
  document.getElementById('moneyMultiplier').textContent=(rebirthCount+1);

  requestAnimationFrame(animate);
}
animate();

// ---------- UPGRADES ----------
function getRebirthColors(rc){
  const scheme=[{base:60},{base:80},{base:100},{base:120}][rc%4];
  const num=Math.min(10+rc,50);
  const out=[];
  for(let i=0;i<num;i++){ const hue=Math.floor(Math.random()*360); out.push({ color:`hsl(${hue},${scheme.base}%,60%)`, value:i+1 }); }
  return out;
}

function updateButtons(){
  document.getElementById('buyColor').textContent=unlockedColors>=colors.length?'MAX':`Buy Color ($${colorPrice})`;
  document.getElementById('reduceDelay').textContent=clickDelay<=100?'MAX':`Reduce Delay ($${delayPrice})`;
  document.getElementById('buyAuto').textContent=autoAmount>=3?'MAX':`Buy Auto-Launch ($${autoPrice})`;
  document.getElementById('rebirth').textContent=`Rebirth ($${rebirthPrice})`;
  document.getElementById('delayDisplay').textContent=clickDelay;
  document.getElementById('autoSpeedDisplay').textContent=autoSpeed.toFixed(2);
  document.getElementById('unlockedColors').textContent=unlockedColors;
}

// ---------- FIREWORK UPGRADES & BUTTONS ----------
const buyColorBtn = document.getElementById('buyColor');
const reduceDelayBtn = document.getElementById('reduceDelay');
const rebirthBtn = document.getElementById('rebirth');
const buyAutoBtn = document.getElementById('buyAuto');

buyColorBtn.addEventListener('click',()=>{
  if(money>=colorPrice && unlockedColors<colors.length){
    money -= colorPrice; unlockedColors++;
    colorPrice = Math.floor(colorPrice*1.5);
    document.getElementById('money').textContent = money;
    updateButtons();
    saveProgressOnline();
  }
});

reduceDelayBtn.addEventListener('click',()=>{
  if(money>=delayPrice && clickDelay>100){
    money -= delayPrice;
    clickDelay = Math.max(100, clickDelay - 100);
    delayPrice = Math.floor(delayPrice*1.6);
    document.getElementById('money').textContent = money;
    updateButtons();
    saveProgressOnline();
  }
});

rebirthBtn.addEventListener('click',()=>{
  if(money>=rebirthPrice){
    money = 0; unlockedColors=1; clickDelay=1200; rebirthCount++;
    colors = baseColors.concat(getRebirthColors(rebirthCount));
    rebirthPrice = Math.floor(rebirthPrice*2.5);
    updateButtons();
    document.getElementById('money').textContent = money;
    saveProgressOnline();
    showNotification('You rebirthed! +1 multiplier');
  }
});

buyAutoBtn.addEventListener('click',()=>{
  if(money>=autoPrice && autoAmount<3){
    money -= autoPrice; autoAmount++;
    autoSpeed = Math.max(0.5, autoSpeed - 0.5);
    document.getElementById('money').textContent = money;
    updateButtons();
    setupAutoLaunch();
    saveProgressOnline();
  }
});

function setupAutoLaunch(){
  if(autoInterval) clearInterval(autoInterval);
  if(autoAmount>0){
    autoInterval = setInterval(()=>{
      const x = Math.random()*canvas.width;
      const y = Math.random()*(canvas.height/2);
      launchFirework(x,y);
    }, autoSpeed*1000);
  }
}

// ---------- OWNER COMMANDS ----------
const ownerUID = auth.currentUser?.uid || "";
if(ADMIN_FALLBACK[ownerUID]) ownerCommands.style.display='block';

document.getElementById('giveMoneyBtn').addEventListener('click',()=>{
  money += 1000; document.getElementById('money').textContent = money; saveProgressOnline();
});

document.getElementById('unlockColorsBtn').addEventListener('click',()=>{
  unlockedColors = colors.length; updateButtons(); saveProgressOnline();
});

document.getElementById('maxAutoBtn').addEventListener('click',()=>{
  autoAmount = 3; autoSpeed = 0.5; setupAutoLaunch(); updateButtons(); saveProgressOnline();
});

document.getElementById('adminFireworkBtn').addEventListener('click',()=>{
  for(let i=0;i<20;i++){
    const x = Math.random()*canvas.width;
    const y = Math.random()*(canvas.height/2);
    fireworks.push(new Firework(x,y,colors[Math.floor(Math.random()*colors.length)]));
  }
});

document.getElementById('adminFireworkBtnNuke').addEventListener('click',()=>{
  for(let i=0;i<50;i++){
    const x = Math.random()*canvas.width;
    const y = Math.random()*(canvas.height/2);
    fireworks.push(new Firework(x,y,colors[Math.floor(Math.random()*colors.length)]));
  }
});

document.getElementById('glitchEventBtn').addEventListener('click',()=>{
  glitchActive = !glitchActive;
  showNotification(glitchActive?'Glitch Event ON':'Glitch Event OFF',3000);
});

// ---------- TAG INVENTORY ----------
const tagInventoryList = document.getElementById('tagInventoryList');
function updateTagsUI(tagsObj){
  tagInventoryList.innerHTML="";
  for(const tag in tagsObj){
    const row=document.createElement('div'); row.className='tagRow';
    row.innerHTML=`<span class="tagName tag-${tag}">${TAGS_INFO[tag]?.name||tag}</span><span class="tagDesc">${TAGS_INFO[tag]?.description||''}</span>`;
    tagInventoryList.appendChild(row);
  }
}

// ---------- SAVE / LOAD ----------
async function saveProgressOnline(){
  if(!currentUser) return;
  try{
    await db.ref('progress/'+currentUser).set({
      money, unlockedColors, clickDelay, rebirthCount, autoAmount, autoSpeed
    });
    await db.ref('tags/'+currentUser).set(userTags);
    console.log('Progress saved');
  }catch(e){ console.warn('Save failed',e); }
}

let userTags={regular:true};
async function loadProgressOnline(){
  if(!currentUser) return;
  try{
    const snap = await db.ref('progress/'+currentUser).once('value');
    const data = snap.val();
    if(data){ money=data.money||0; unlockedColors=data.unlockedColors||1; clickDelay=data.clickDelay||1200;
      rebirthCount=data.rebirthCount||0; autoAmount=data.autoAmount||0; autoSpeed=data.autoSpeed||2.5; 
    }
    updateButtons();
    document.getElementById('money').textContent = money;

    const tagSnap = await db.ref('tags/'+currentUser).once('value');
    userTags = tagSnap.val() || {regular:true};
    updateTagsUI(userTags);
    document.getElementById('tagInventory').style.display='block';
  }catch(e){ console.warn('Load failed',e); }
}

// ---------- LOGIN / SIGNUP ----------
loginBtn.addEventListener('click',async()=>{
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  try{
    const cred=await auth.signInWithEmailAndPassword(email,password);
    currentUser=cred.user.uid; currentUsername=cred.user.displayName||cred.user.email;
    loginBox.style.display='none'; ui.style.display='block'; logoutBtn.style.display='block';
    await loadProgressOnline();
    setupAutoLaunch();
    showNotification('Logged in as '+currentUsername);
  }catch(e){ loginMsg.textContent = e.message; }
});

signupBtn.addEventListener('click',async()=>{
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const username=document.getElementById('username').value||'Player';
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,password);
    currentUser=cred.user.uid; currentUsername=username;
    await cred.user.updateProfile({displayName:username});
    loginBox.style.display='none'; ui.style.display='block'; logoutBtn.style.display='block';
    await saveProgressOnline();
    showNotification('Signed up as '+username);
  }catch(e){ loginMsg.textContent = e.message; }
});

logoutBtn.addEventListener('click',async()=>{
  await auth.signOut(); location.reload();
});

// ---------- RESET ----------
resetBtn.addEventListener('click',()=>{
  if(confirm('Are you sure?')){ money=0; unlockedColors=1; clickDelay=1200; rebirthCount=0; autoAmount=0; autoSpeed=2.5; colors=[...baseColors]; userTags={regular:true}; updateButtons(); updateTagsUI(userTags); saveProgressOnline(); }
});

// ---------- AUTO LAUNCH ----------
setupAutoLaunch();
updateButtons();


</script>
</body>
</html>
