// Normalize username to lowercase and replace leet chars
function normalizeName(name){
  return name
    .toLowerCase()
    .split('')
    .map(c => leetMap[c] || c)
    .join('');
}

// Super-strict censor function
function censorUsername(username){
  let normalized = normalizeName(username);

  bannedWords.forEach(word => {
    const regex = new RegExp(word, "gi");

    // If normalized username contains banned word
    if(normalized.includes(word)){
      // Replace the matched part in original username with asterisks
      // This uses a loose regex to catch variations like S41T, $h1t, etc.
      const replaceRegex = new RegExp(
        word.split('').map(c => `[${c}${Object.keys(leetMap).join('')}]`).join(''),
        "gi"
      );
      username = username.replace(replaceRegex, "*".repeat(word.length));
    }
  });

  return username;
}

/* FIREWORK CLASSES */
class Firework {
  constructor(x, y, colorObj) {
    this.x = x;
    this.y = canvas.height;
    this.targetY = y;
    this.speed = Math.random() * 2 + 4;
    this.colorObj = colorObj;
    this.exploded = false;
  }

  update() {
    // glitch shake
    if (glitchActive) {
      this.x += (Math.random() - 0.5) * 6;
      this.y += (Math.random() - 0.5) * 6;
    }

    this.y -= this.speed;
    if (this.y <= this.targetY && !this.exploded) {
      this.exploded = true;
      explode(this.x, this.y, this.colorObj);
      return true;
    }
    return false;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = glitchActive
      ? `hsl(${Math.random() * 360},100%,60%)`
      : this.colorObj.color;
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, colorObj) {
    this.x = x;
    this.y = y;
    this.color = colorObj.color;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 100;
  }

  update() {
    this.vy += gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = glitchActive
      ? `hsl(${Math.random() * 360},100%,60%)`
      : this.color;
    ctx.fill();
  }
}

function spawnGalaxySpiral() {
  const centerX = Math.random() * canvas.width;
  let centerY = canvas.height - 60;

  const angleOffset = Math.random() * Math.PI * 2;

  class SpiralFirework extends Firework {
    constructor(angle, radius) {
      super(centerX, centerY, { color: 'hsl(260,100%,70%)', value: 1 });
      this.angle = angle;
      this.radius = radius;
    }

    update() {
      this.angle += 0.25;
      this.radius += Math.random(0.4,1);
      centerY -= 1;

      this.x = centerX + Math.cos(this.angle) * this.radius;
      this.y = centerY + Math.sin(this.angle) * this.radius;

      if (this.y < canvas.height * 0.25) {
        explode(this.x, this.y, this.colorObj);
        return true;
      }
      return false;
    }
  }

  for (let i = 0; i < 6; i++) {
    fireworks.push(new SpiralFirework(angleOffset + i, i * 6));
  }
}

async function sendAdminEvent(type, message = '', duration = 3000){
  try{
    const snap = await db.ref('admins/' + currentUser).once('value');
    if(!snap.exists() && !ADMIN_FALLBACK[currentUser]){
      showNotification('Not admin');
      return;
    }

    await db.ref('adminEvents/latest').set({
      type,
      message,
      duration,
      timestamp: Date.now()
    });
  }catch(e){
    if(ADMIN_FALLBACK[currentUser]){
      await db.ref('adminEvents/latest').set({
        type,
        message,
        duration,
        timestamp: Date.now()
      });
    }else{
      showNotification('Not admin');
    }
  }
}

      lastAdminTimestamp=val.timestamp;
    if (val.type === 'MESSAGE') {
      showNotification('📢 ' + val.message, val.duration || 5000);
    }
    else if (val.type === 'GLITCH') {
      showNotification(val.message || '⚠ GLITCH EVENT', val.duration || 8000);
      startGlitchEvent(val.duration || 30000); // 30 seconds
    }
    else {
      showNotification(`ADMIN EVENT: ${val.type}`);
    }

      if(val.type==='NUKE') for(let i=0;i<10;i++) fireworks.push(new Firework(Math.random()*canvas.width, Math.random()*canvas.height, {color:'white', value:10}));
      if(val.type === 'megaFirework') {
        for(let i = 0; i < 30; i++) {
          // random X across canvas, targetY somewhere in upper half
          const x = Math.random() * canvas.width;
          const targetY = Math.random() * canvas.height / 2 + 50; // between 50px and half screen
          fireworks.push(new Firework(x, targetY, {color:'red', value:50}));
        }
        showNotification('Mega Firework launched!');
      }
        if (val.type === 'Galaxy') {
          galaxyEventActive = true;
          galaxyEventEnd = Date.now() + 30000; // 30 sec
        
          showNotification('🌌 GALAXY EVENT ACTIVE!', 30000);
        }
    }
  });
}
initAdminEventsListener();

/* AUTO-LAUNCH */
function startAutoLaunch(){
  if(autoInterval) clearInterval(autoInterval);
  if(autoAmount>0){
    autoInterval=setInterval(()=>{
      for(let i=0;i<autoAmount;i++){
        launchFirework(Math.random()*canvas.width, Math.random()*canvas.height/2+100);
      }
    },autoSpeed*1000);
  }
}

  function startGlitchEvent(duration){
  if (glitchActive) return;

  glitchActive = true;
  globalMultiplier = 2;
  document.body.classList.add('glitch-ui');

  setTimeout(() => {
    glitchActive = false;
    globalMultiplier = 1;
    document.body.classList.remove('glitch-ui');
  }, duration);
}

// DISCO event function
function startDiscoEvent(duration){
  let discoEnd = Date.now() + duration;
  let discoColors = ['red','orange','yellow','lime','cyan','magenta'];

  function discoLoop(){
    if(Date.now() > discoEnd) return; // end event

    // Flash background color
    canvas.style.background = discoColors[Math.floor(Math.random()*discoColors.length)];

    // Spawn random fireworks everywhere
    for(let i=0;i<5;i++){
      fireworks.push(new Firework(
        Math.random()*canvas.width, 
        Math.random()*canvas.height, 
        { color: discoColors[Math.floor(Math.random()*discoColors.length)], value: 5 }
      ));
    }

    setTimeout(discoLoop, 150); // 6-7 flashes per second
  }

  discoLoop();
}

/* SAVE & LOAD PROGRESS */
async function saveProgressOnline(){
  if(!currentUser) return;
  await db.ref('progress/'+currentUser).set({
    money, unlockedColors, clickDelay, rebirthCount, autoAmount, autoSpeed, colorPrice, delayPrice, rebirthPrice
  });
}
async function loadProgressOnline(uid){
  const snap=await db.ref('progress/'+uid).once('value');
  if(snap.exists()){ const p=snap.val();
    money=p.money||0; unlockedColors=p.unlockedColors||1; clickDelay=p.clickDelay||1200;
    rebirthCount=p.rebirthCount||0; autoAmount=p.autoAmount||0; autoSpeed=p.autoSpeed||2.5;
    colorPrice=p.colorPrice||50; delayPrice=p.delayPrice||100; rebirthPrice=p.rebirthPrice||500;
    colors=[...baseColors,...getRebirthColors(rebirthCount)];
    Buttons(); document.getElementById('money').textContent = formatMoney(money);
    startAutoLaunch();
  }
}

async function loadTagsUI() {
  const invDiv = document.getElementById('tagInventory');
  const invList = document.getElementById('tagInventoryList');
  invList.innerHTML = '';

  invDiv.style.display = 'block'; // always show the inventory

  try {
    // get user's owned tags
    const snap = await db.ref('tags/' + currentUser).once('value');
    const owned = snap.val() || {};

    // get currently active tag
    let activeTag = null;
    try {
      const activeSnap = await db.ref('activeTag/' + currentUser).once('value');
      activeTag = activeSnap.val();
    } catch(e){ /* ignore */ }

    // iterate over all tag types
    for (const key in TAGS_INFO) {
      const info = TAGS_INFO[key];
      const row = document.createElement('div');

      // ADD CLASS FOR CSS COLOR
      row.className = 'tagRow tag-' + key; // e.g., tag-owner, tag-vip, etc.

      // tag name
      const nameSpan = document.createElement('span');
      nameSpan.className = 'tagName';
      nameSpan.textContent = info.name;
      row.appendChild(nameSpan);

      // status
      const status = document.createElement('span');
      status.style.marginRight = '8px';

      // button
      const btn = document.createElement('button');
      btn.style.marginLeft = '8px';
      btn.style.padding = '2px 6px';
      btn.style.borderRadius = '4px';
      btn.style.cursor = 'pointer';

      if (owned[key]) {
        status.textContent = 'Owned';
        status.style.color = 'lightgreen';

        if (activeTag === key) {
          btn.textContent = 'Unequip';
          btn.onclick = async () => {
            await db.ref(`activeTag/${currentUser}`).remove();
            showNotification(`Unequipped ${info.name}`);
            loadTagsUI(); // refresh UI
          };
        } else {
          btn.textContent = 'Equip';
          btn.onclick = async () => {
            await db.ref(`activeTag/${currentUser}`).set(key);
            showNotification(`Equipped ${info.name}`);
            loadTagsUI(); // refresh UI
          };
        }
      } else {
        status.textContent = 'Locked';
        status.style.color = 'lightcoral';
        btn.textContent = 'Locked';
        btn.disabled = true;
      }

      row.appendChild(status);
      row.appendChild(btn);

      // description
      const desc = document.createElement('div');
      desc.className = 'tagDesc';
      desc.textContent = info.description;
      row.appendChild(desc);

      invList.appendChild(row);
    }
  } catch (e) {
    console.error('loadTagsUI error', e);
    const invErr = document.createElement('div');
    invErr.textContent = 'Could not load tags (DB rules?)';
    invErr.style.color = 'red';
    invList.appendChild(invErr);
  }
}


/* LOGIN & AUTH */
loginBtn.addEventListener('click',()=>{ const email=document.getElementById('email').value; const pw=document.getElementById('password').value; auth.signInWithEmailAndPassword(email,pw).then(res=>{ currentUser=res.user.uid; currentUsername=res.user.displayName||res.user.email; afterLogin(); }).catch(e=>loginMsg.textContent=e.message); });
signupBtn.addEventListener('click',()=>{
  const email = document.getElementById('email').value;
  const pw = document.getElementById('password').value;
  let username = document.getElementById('username').value || 'Player';

  // Apply censor here
  username = censorUsername(username);

  auth.createUserWithEmailAndPassword(email, pw).then(res=>{
    res.user.updateProfile({displayName: username});
    currentUser = res.user.uid;
    currentUsername = username;
    afterLogin();
  }).catch(e => loginMsg.textContent = e.message);
});

forgotBtn.addEventListener('click',()=>{ const email=document.getElementById('email').value; auth.sendPasswordResetEmail(email).then(()=>{ loginMsg.textContent='Reset email sent!'; }).catch(e=>loginMsg.textContent=e.message); });

//logout button code
logoutBtn.addEventListener('click',()=>{  
  if (!confirm('Are you sure you want to logout?')) return;
  auth.signOut().then(()=>{ location.reload(); }); });

function afterLogin(){
  // Censor username after login
  currentUsername = censorUsername(currentUsername);

  loginBox.style.display='none'; 
  ui.style.display='block'; 
  resetBtn.style.display='block'; 
  logoutBtn.style.display='block';
  muteBtn.style.display='block';
  goGoogleForm.style.display='block';

  if(ADMIN_FALLBACK[currentUser]) ownerCommands.style.display='block';

  loadProgressOnline(currentUser).catch(()=>{});
  loadTagsUI();
}


// --- AUTO-LOGIN & LOAD PROGRESS ---
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user.uid;
    currentUsername = user.displayName || user.email;
    afterLogin(); // show UI, load progress, tags, owner commands
  } else {
    loginBox.style.display = 'block';
    ui.style.display = 'none';
  }
});

async function loadProgressOnline(uid){
  const snap = await db.ref('progress/' + uid).once('value');
  if(snap.exists()){
    const p = snap.val();
    money = p.money || 0;
    unlockedColors = p.unlockedColors || 1;
    clickDelay = p.clickDelay || 1200;
    rebirthCount = p.rebirthCount || 0;
    autoAmount = p.autoAmount || 0;
    autoSpeed = p.autoSpeed || 2.5;
    colorPrice = p.colorPrice || 50;
    delayPrice = p.delayPrice || 100;
    rebirthPrice = p.rebirthPrice || 500;

    // Rebuild color array based on rebirths
    colors = [...baseColors, ...getRebirthColors(rebirthCount)];

    // Update UI elements
    document.getElementById('money').textContent = money;
    updateButtons();

    // Start auto-launch if purchased
    startAutoLaunch();
  } else {
    // No saved progress, initialize defaults
    money = 0; unlockedColors = 1; clickDelay = 1200;
    rebirthCount = 0; autoAmount = 0; autoSpeed = 2.5;
    colorPrice = 50; delayPrice = 100; rebirthPrice = 500;
    colors = [...baseColors];
    updateButtons();
    startAutoLaunch();
  }
}
