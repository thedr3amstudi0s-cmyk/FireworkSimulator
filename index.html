<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Firework Simulator</title>
<style>
  html,body { margin:0; padding:0; height:100%; background:#000; font-family:Arial, sans-serif; }
  canvas { display:block; width:100%; height:100%; background: radial-gradient(circle at bottom,#0a0a0a,#000); }

  #loginBox { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
     background:#222; padding:28px; border-radius:10px; color:white; z-index:200; width:280px; }
  #loginBox input, #loginBox button { display:block; margin:8px 0; padding:10px; width:100%; border-radius:6px; border:none; box-sizing:border-box; }
  #loginBox button { background:cyan; color:#000; cursor:pointer; font-weight:700; }
  #loginBox button:hover{ filter:brightness(1.05); }

  #ui { position:fixed; top:10px; left:10px; color:white; z-index:150; }
  #ui h2{ margin:0 0 8px 0; color:#fff; font-size:18px; }
  #ui button { margin:4px 4px 4px 0; padding:6px 8px; border-radius:6px; border:none; cursor:pointer; }
  #ownerCommands{ margin-top:8px; display:none; background:rgba(255,255,255,0.03); padding:6px; border-radius:6px; }
  #cooldownBar{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:280px; height:18px; background:rgba(255,255,255,0.12); border-radius:9px; z-index:160; }
  #cooldownFill{ height:100%; width:0%; background:limegreen; border-radius:8px; transition:width 0.05s; }
  #resetBtn { position:fixed; top:10px; right:10px; padding:6px 8px; background:#c0392b; color:white; border:none; border-radius:6px; display:none; z-index:150; }
  #logoutBtn { position:fixed; top:50px; right:10px; padding:6px 8px; background:orange; color:white; border:none; border-radius:6px; z-index:150; }
  #notifications { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:300; color:#0ff; font-weight:700; text-shadow:0 0 6px rgba(0,0,0,0.8); pointer-events:none; }

  #ui p { margin:6px 0; font-size:13px; color:#ddd; }
  #tagInventory { margin-top:10px; background:rgba(255,255,255,0.02); padding:8px; border-radius:8px; max-width:320px; }
  #tagInventory h4 { margin:0 0 6px 0; color:#fff; font-size:14px; }
  #tagInventory .tagRow { margin:6px 0; font-size:13px; color:#ddd; }
  #tagInventory .tagName { color:#0ff; font-weight:700; margin-right:6px; }
  #tagInventory .tagDesc { color:#aaa; font-style:italic; display:block; margin-top:2px; }

  .tag-owner .tagName { color: gold; }
  .tag-vip .tagName { color: cyan; }
  .tag-donator .tagName { color: green; }
  .tag-streamer .tagName { color: purple; } 
  .tag-youtuber .tagName { color: red; }
  .tag-regular .tagName { color: white; }

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="loginBox">
  <input id="username" placeholder="Username (3-16 chars, optional on login)"/>
  <input id="email" type="email" placeholder="Email"/>
  <input id="password" type="password" placeholder="Password"/>
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <button id="forgotBtn" style="background:#444;color:white;">Forgot Password?</button>
  <p id="loginMsg" style="color:yellow; margin:6px 0 0 0; font-size:13px;"></p>
</div>

<div id="ui" style="display:none;">
  <h2>Money: $<span id="money">0</span></h2>

  <div>
    <button id="buyColor">Buy Color ($<span id="colorPrice">50</span>)</button>
    <button id="reduceDelay">Reduce Delay ($<span id="delayPrice">100</span>)</button>
    <button id="rebirth">Rebirth ($<span id="rebirthPrice">500</span>)</button>
    <button id="buyAuto">Buy Auto-Launch ($<span id="autoPrice">200</span>)</button>
    <button id="goLeaderboardBtn">Open Leaderboard</button>
  </div>

  <p>Unlocked Colors: <span id="unlockedColors">1</span></p>
  <p>Click Delay: <span id="delayDisplay">1200</span> ms</p>
  <p>Firework Money Multiplier: x<span id="moneyMultiplier">1</span></p>
  <p>Auto Speed: <span id="autoSpeedDisplay">2.50</span> sec</p>

  <div id="ownerCommands">
    <strong>Owner</strong><br/>
    <button id="giveMoneyBtn">Give $1000</button>
    <button id="unlockColorsBtn">Unlock All Colors</button>
    <button id="maxAutoBtn">Max Auto-Launch</button>
    <button id="viewUsersBtn">View Users</button>
    <button id="adminFireworkBtn">Mega Firework</button>
    <button id="adminFireworkBtnNuke">NUKE</button>
    <button id="adminFireworkBtnGalaxy">Galaxy</button>
  </div>

  <div id="tagInventory" style="display:none;">
    <h4>Tag Inventory</h4>
    <div id="tagInventoryList"></div>
  </div>
</div>

<button id="resetBtn">Reset Progress</button>
<button id="logoutBtn">Logout</button>
<div id="cooldownBar"><div id="cooldownFill"></div></div>
<div id="notifications"></div>
<audio id="fireworkSound" src="assets/single-firework-79814.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const loginBox = document.getElementById('loginBox');
const loginBtn = document.getElementById('loginBtn');
const signupBtn = document.getElementById('signupBtn');
const forgotBtn = document.getElementById('forgotBtn');
const loginMsg = document.getElementById('loginMsg');
const ui = document.getElementById('ui');
const ownerCommands = document.getElementById('ownerCommands');
const resetBtn = document.getElementById('resetBtn');
const logoutBtn = document.getElementById('logoutBtn');
const notifications = document.getElementById('notifications');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fireworkSound = document.getElementById('fireworkSound');

function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* GAME STATE */
let currentUser="", currentUsername="";
let money=0, unlockedColors=1, clickDelay=1200, lastClick=Date.now();
let rebirthCount=0, colorPrice=50, delayPrice=100, rebirthPrice=500, autoPrice=200;
let autoAmount=0, autoSpeed=2.5, fireworks=[], particles=[], autoInterval=null;
const gravity=0.04;

const baseColors=[
  { color:"hsl(0,100%,60%)", value:1},
  { color:"hsl(30,100%,60%)", value:2},
  { color:"hsl(60,100%,60%)", value:3},
  { color:"hsl(120,100%,60%)", value:4},
  { color:"hsl(180,100%,60%)", value:5},
  { color:"hsl(240,100%,60%)", value:6}
];
let colors=[...baseColors];

const ADMIN_FALLBACK = { "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true, "BxQ1aTqPndOfHzuX3OzlCcD4pbC3": true };

const TAGS_INFO = {
  owner: { name: "Owner", description: "Assigned to admins (managed in /admins)" },
  vip: { name: "VIP", description: "Give to some supporters — can be given" },
  donator: { name: "Donator", description: "Cosmetic thank-you for supporting dr3am studi0s" },
  streamer: { name: "Streamer", description: "Given to verified streamers" },
  streamer: { name: "Youtuber", description: "Given to verified youtubers" },
  regular: { name: "Regular", description: "Default player tag" }
};

let lastAdminTimestamp=0;

function showNotification(text,time=2500){
  notifications.textContent=text;
  notifications.style.opacity='1';
  setTimeout(()=>{ notifications.style.opacity='0'; },time);
}

/* FIREWORK CLASSES */
class Firework{
  constructor(x,y,colorObj){ this.x=x; this.y=canvas.height; this.targetY=y; this.speed=Math.random()*2+4; this.colorObj=colorObj; this.exploded=false; }
  update(){ 
    this.y-=this.speed; 
    if(this.y<=this.targetY && !this.exploded){ this.exploded=true; explode(this.x,this.y,this.colorObj); return true; } 
    return false; 
  }
  draw(){ ctx.beginPath(); ctx.arc(this.x,this.y,2,0,Math.PI*2); ctx.fillStyle=this.colorObj.color; ctx.fill(); }
}
class Particle{
  constructor(x,y,colorObj){ this.x=x; this.y=y; this.color=colorObj.color; this.vx=(Math.random()-0.5)*6; this.vy=(Math.random()-0.5)*6; this.life=100; }
  update(){ this.vy+=gravity; this.x+=this.vx; this.y+=this.vy; this.life--; }
  draw(){ ctx.beginPath(); ctx.arc(this.x,this.y,2,0,Math.PI*2); ctx.fillStyle=this.color; ctx.fill(); }
}

/* CORE FUNCTIONS */
function explode(x,y,colorObj){
  try{ fireworkSound.currentTime=0; fireworkSound.play(); } catch(e){}
  for(let i=0;i<80;i++) particles.push(new Particle(x,y,colorObj));
  money+=colorObj.value*(rebirthCount+1);
  document.getElementById('money').textContent=money;
  saveProgressOnline().catch(()=>{});
}

function launchFirework(x,y){
  if(colors.length===0) colors=[...baseColors];
  const max=Math.min(unlockedColors,colors.length);
  const colorIndex=Math.floor(Math.random()*Math.max(1,max));
  const colorObj=colors[colorIndex];
  fireworks.push(new Firework(x,y,colorObj));
  lastClick=Date.now();
}

document.addEventListener('click',(e)=>{ if(Date.now()-lastClick>=clickDelay) launchFirework(e.clientX,e.clientY); });

function animate(){
  ctx.fillStyle="rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let i=fireworks.length-1;i>=0;i--){ if(fireworks[i].update()) fireworks.splice(i,1); else fireworks[i].draw(); }
  for(let i=particles.length-1;i>=0;i--){ particles[i].update(); particles[i].draw(); if(particles[i].life<=0) particles.splice(i,1); }

  const elapsed=Date.now()-lastClick;
  const pct=Math.min(100,(elapsed/clickDelay)*100);
  document.getElementById('cooldownFill').style.width=pct+'%';
  document.getElementById('moneyMultiplier').textContent=(rebirthCount+1);

  requestAnimationFrame(animate);
}
animate();

/* ======= UPGRADES & UI ======= */
function getRebirthColors(rc){
  const scheme=[{base:60},{base:80},{base:100},{base:120}][rc%4];
  const num=Math.min(10+rc,50);
  const out=[];
  for(let i=0;i<num;i++){ const hue=Math.floor(Math.random()*360); out.push({ color:`hsl(${hue},${scheme.base}%,60%)`, value:i+1 }); }
  return out;
}

function updateButtons(){
  document.getElementById('buyColor').textContent=unlockedColors>=colors.length?'MAX':`Buy Color ($${colorPrice})`;
  document.getElementById('reduceDelay').textContent=clickDelay<=100?'MAX':`Reduce Delay ($${delayPrice})`;
  document.getElementById('buyAuto').textContent=autoAmount>=3?'MAX':`Buy Auto-Launch ($${autoPrice})`;
  document.getElementById('rebirth').textContent=`Rebirth ($${rebirthPrice})`;
  document.getElementById('delayDisplay').textContent=clickDelay;
  document.getElementById('autoSpeedDisplay').textContent=autoSpeed.toFixed(2);
  document.getElementById('unlockedColors').textContent=unlockedColors;
}

/* BUTTON HANDLERS */
document.getElementById('buyColor').addEventListener('click',()=>{
  if(money>=colorPrice && unlockedColors<colors.length){
    money-=colorPrice; unlockedColors++; colorPrice=Math.floor(colorPrice*1.7);
    document.getElementById('money').textContent=money;
    updateButtons(); saveProgressOnline().catch(()=>{}); showNotification('Color unlocked!');
  }
});
document.getElementById('reduceDelay').addEventListener('click',()=>{
  if(money>=delayPrice && clickDelay>100){
    money-=delayPrice; clickDelay=Math.max(100,clickDelay-100); delayPrice=Math.floor(delayPrice*1.7);
    document.getElementById('money').textContent=money; updateButtons(); saveProgressOnline().catch(()=>{}); showNotification('Delay reduced!');
  }
});
document.getElementById('buyAuto').addEventListener('click',()=>{
  if(money>=autoPrice && autoAmount<3){
    money-=autoPrice; autoAmount++; autoSpeed/=1.2; autoPrice=Math.floor(autoPrice*1.7);
    document.getElementById('money').textContent=money; updateButtons(); saveProgressOnline().catch(()=>{}); startAutoLaunch(); showNotification('Auto-launch purchased!');
  }
});
document.getElementById('rebirth').addEventListener('click', async ()=>{
  if(money<rebirthPrice){ showNotification(`Need $${rebirthPrice} to rebirth!`); return; }
  if(!confirm(`Are you sure you want to rebirth for $${rebirthPrice}?`)) return;
  money=0; rebirthCount++; unlockedColors=1; clickDelay=1200; autoAmount=0; autoSpeed=2.5; autoPrice=200; colorPrice=50; delayPrice=100;
  rebirthPrice=Math.floor(500*Math.pow(1.5,rebirthCount));
  colors=[...baseColors,...getRebirthColors(rebirthCount)];
  updateButtons(); document.getElementById('money').textContent=money; await saveProgressOnline().catch(()=>{}); saveScore(); startAutoLaunch(); showNotification('Rebirth complete!');
});
document.getElementById('goLeaderboardBtn').addEventListener('click', () => {
  window.open('https://thedr3amstudi0s-cmyk.github.io/FireworkSimulator/fireworkleaderboard.html', '_blank');
});


/* ADMIN BUTTONS */
document.getElementById('giveMoneyBtn').addEventListener('click',()=>{ money+=1000; document.getElementById('money').textContent=money; saveProgressOnline().catch(()=>{}); });
document.getElementById('unlockColorsBtn').addEventListener('click',()=>{ unlockedColors=colors.length; updateButtons(); saveProgressOnline().catch(()=>{}); });
document.getElementById('maxAutoBtn').addEventListener('click',()=>{ autoAmount=3; autoSpeed=0.1; updateButtons(); startAutoLaunch(); saveProgressOnline().catch(()=>{}); });
document.getElementById('viewUsersBtn').addEventListener('click',()=>{ showNotification('Check Firebase console for users.'); });

async function sendAdminEvent(type,message){
  try{
    const snap=await db.ref('admins/'+currentUser).once('value');
    if(!snap.exists() && !ADMIN_FALLBACK[currentUser]){ showNotification('Not admin'); return; }
    await db.ref('adminEvents/latest').set({type,message,timestamp:Date.now()});
  }catch(e){
    if(ADMIN_FALLBACK[currentUser]){
      try{ await db.ref('adminEvents/latest').set({type,message,timestamp:Date.now()}); }catch(err){ showNotification('Permission denied writing admin event'); return; }
    }else{ showNotification('Not admin'); return; }
  }
}
document.getElementById('adminFireworkBtn').addEventListener('click',()=>sendAdminEvent('megaFirework','Admin launched a mega firework!'));
document.getElementById('adminFireworkBtnNuke').addEventListener('click',()=>sendAdminEvent('NUKE','Admin launched a NUKE!'));
document.getElementById('adminFireworkBtnGalaxy').addEventListener('click',()=>sendAdminEvent('Galaxy','Admin launched everyone into the galaxy'));

async function initAdminEventsListener(){
  try{ const snap=await db.ref('adminEvents/latest').once('value'); lastAdminTimestamp=(snap.val()?.timestamp)||0; }catch(e){}
  db.ref('adminEvents/latest').on('value',snap=>{
    const val=snap.val(); if(!val) return; 
    if(val.timestamp>lastAdminTimestamp){
      lastAdminTimestamp=val.timestamp;
      showNotification(`ADMIN EVENT: ${val.type}`);
      if(val.type==='NUKE') for(let i=0;i<10;i++) fireworks.push(new Firework(Math.random()*canvas.width, Math.random()*canvas.height, {color:'white', value:100}));
      if(val.type === 'megaFirework') {
        for(let i = 0; i < 10; i++) {
          // random X across canvas, targetY somewhere in upper half
          const x = Math.random() * canvas.width;
          const targetY = Math.random() * canvas.height / 2 + 50; // between 50px and half screen
          fireworks.push(new Firework(x, targetY, {color:'red', value:50}));
        }
        showNotification('Mega Firework launched!');
      }
        if(val.type === 'Galaxy') {
          const count = 20 + Math.floor(Math.random() * 11); // 20–30 fireworks
          const centerX = canvas.width;
          const centerY = canvas.height / 2;
        
          for(let i = 0; i < count; i++) {
            // Spiral math
            const angle = i * 0.5; // controls how tight the spiral is
            const radius = i * 8;  // gradually increases distance from center
            const x = centerX + radius * Math.cos(angle); 
            const targetY = canvas.height - (i * 15 + 50); // staggered vertical positions
            fireworks.push(new Firework(x, targetY, {color:'purple', value:50}));
          }
        
          showNotification('🌌 Galaxy Event launched!');
        }

    }
  });
}
initAdminEventsListener();

/* AUTO-LAUNCH */
function startAutoLaunch(){
  if(autoInterval) clearInterval(autoInterval);
  if(autoAmount>0){
    autoInterval=setInterval(()=>{
      for(let i=0;i<autoAmount;i++){
        launchFirework(Math.random()*canvas.width, Math.random()*canvas.height/2+100);
      }
    },autoSpeed*1000);
  }
}

/* SAVE & LOAD PROGRESS */
async function saveProgressOnline(){
  if(!currentUser) return;
  await db.ref('progress/'+currentUser).set({
    money, unlockedColors, clickDelay, rebirthCount, autoAmount, autoSpeed, colorPrice, delayPrice, rebirthPrice
  });
}
async function loadProgressOnline(uid){
  const snap=await db.ref('progress/'+uid).once('value');
  if(snap.exists()){ const p=snap.val();
    money=p.money||0; unlockedColors=p.unlockedColors||1; clickDelay=p.clickDelay||1200;
    rebirthCount=p.rebirthCount||0; autoAmount=p.autoAmount||0; autoSpeed=p.autoSpeed||2.5;
    colorPrice=p.colorPrice||50; delayPrice=p.delayPrice||100; rebirthPrice=p.rebirthPrice||500;
    colors=[...baseColors,...getRebirthColors(rebirthCount)];
    updateButtons(); document.getElementById('money').textContent=money;
    startAutoLaunch();
  }
}

async function loadTagsUI() {
  const invDiv = document.getElementById('tagInventory');
  const invList = document.getElementById('tagInventoryList');
  invList.innerHTML = '';

  invDiv.style.display = 'block'; // always show the inventory

  try {
    // get user's owned tags
    const snap = await db.ref('tags/' + currentUser).once('value');
    const owned = snap.val() || {};

    // get currently active tag
    let activeTag = null;
    try {
      const activeSnap = await db.ref('activeTag/' + currentUser).once('value');
      activeTag = activeSnap.val();
    } catch(e){ /* ignore */ }

    // iterate over all tag types
    for (const key in TAGS_INFO) {
      const info = TAGS_INFO[key];
      const row = document.createElement('div');

      // ADD CLASS FOR CSS COLOR
      row.className = 'tagRow tag-' + key; // e.g., tag-owner, tag-vip, etc.

      // tag name
      const nameSpan = document.createElement('span');
      nameSpan.className = 'tagName';
      nameSpan.textContent = info.name;
      row.appendChild(nameSpan);

      // status
      const status = document.createElement('span');
      status.style.marginRight = '8px';

      // button
      const btn = document.createElement('button');
      btn.style.marginLeft = '8px';
      btn.style.padding = '2px 6px';
      btn.style.borderRadius = '4px';
      btn.style.cursor = 'pointer';

      if (owned[key]) {
        status.textContent = 'Owned';
        status.style.color = 'lightgreen';

        if (activeTag === key) {
          btn.textContent = 'Unequip';
          btn.onclick = async () => {
            await db.ref(`activeTag/${currentUser}`).remove();
            showNotification(`Unequipped ${info.name}`);
            loadTagsUI(); // refresh UI
          };
        } else {
          btn.textContent = 'Equip';
          btn.onclick = async () => {
            await db.ref(`activeTag/${currentUser}`).set(key);
            showNotification(`Equipped ${info.name}`);
            loadTagsUI(); // refresh UI
          };
        }
      } else {
        status.textContent = 'Locked';
        status.style.color = 'lightcoral';
        btn.textContent = 'Locked';
        btn.disabled = true;
      }

      row.appendChild(status);
      row.appendChild(btn);

      // description
      const desc = document.createElement('div');
      desc.className = 'tagDesc';
      desc.textContent = info.description;
      row.appendChild(desc);

      invList.appendChild(row);
    }
  } catch (e) {
    console.error('loadTagsUI error', e);
    const invErr = document.createElement('div');
    invErr.textContent = 'Could not load tags (DB rules?)';
    invErr.style.color = 'red';
    invList.appendChild(invErr);
  }
}


/* LOGIN & AUTH */
loginBtn.addEventListener('click',()=>{ const email=document.getElementById('email').value; const pw=document.getElementById('password').value; auth.signInWithEmailAndPassword(email,pw).then(res=>{ currentUser=res.user.uid; currentUsername=res.user.displayName||res.user.email; afterLogin(); }).catch(e=>loginMsg.textContent=e.message); });
signupBtn.addEventListener('click',()=>{ const email=document.getElementById('email').value; const pw=document.getElementById('password').value; const username=document.getElementById('username').value||'Player'; auth.createUserWithEmailAndPassword(email,pw).then(res=>{ res.user.updateProfile({displayName:username}); currentUser=res.user.uid; currentUsername=username; afterLogin(); }).catch(e=>loginMsg.textContent=e.message); });
forgotBtn.addEventListener('click',()=>{ const email=document.getElementById('email').value; auth.sendPasswordResetEmail(email).then(()=>{ loginMsg.textContent='Reset email sent!'; }).catch(e=>loginMsg.textContent=e.message); });

logoutBtn.addEventListener('click',()=>{ auth.signOut().then(()=>{ location.reload(); }); });

function afterLogin(){
  loginBox.style.display='none'; 
  ui.style.display='block'; 
  resetBtn.style.display='block'; 
  logoutBtn.style.display='block';

  if(ADMIN_FALLBACK[currentUser]) ownerCommands.style.display='block';

  loadProgressOnline(currentUser).catch(()=>{});
  loadTagsUI(); // <-- call without parameters
}

</script>
</body>
</html>
