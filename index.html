<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;font-family:sans-serif;background:#111;color:#fff}
  #ui,#ownerCommands,#eventBanner,#loginBox{position:absolute;z-index:10}
  #ui{top:10px;left:10px}
  #ownerCommands{top:10px;right:10px}
  #eventBanner{top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:10px;border-radius:5px;display:none;text-align:center}
  button{margin:2px;padding:5px 10px;background:#222;color:#fff;border:none;border-radius:3px;cursor:pointer}
  #cooldownBar{width:200px;height:10px;background:#444;border-radius:5px;margin-top:5px}
  #cooldownFill{height:10px;background:#0f0;width:0;border-radius:5px}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="loginBox">
  <button id="loginBtn">Login (Firebase Auth)</button>
</div>

<div id="ui" style="display:none">
  <div>Money: $<span id="money">0</span></div>
  <div>Multiplier: x<span id="moneyMultiplier">1</span></div>
  <div>Colors unlocked: <span id="unlockedColors">1</span></div>
  <div>Click Delay: <span id="delayDisplay">1200</span>ms</div>
  <div>Auto Speed: <span id="autoSpeedDisplay">2.50</span>s</div>
  <button id="buyColor">Buy Color ($50)</button>
  <button id="reduceDelay">Reduce Delay ($100)</button>
  <button id="buyAuto">Buy Auto-Launch ($200)</button>
  <button id="rebirth">Rebirth ($500)</button>
  <button id="resetBtn">Reset Progress</button>
  <button id="logoutBtn">Logout</button>
  <button id="goLeaderboardBtn">Leaderboard</button>
  <div id="cooldownBar"><div id="cooldownFill"></div></div>
</div>

<div id="ownerCommands" style="display:none">
  <button data-event="doubleMoney">Double Money</button>
  <button data-event="rainbowMode">Rainbow Mode</button>
  <button data-event="chaosRoll">Chaos Roll</button>
  <button data-event="blackout">Blackout</button>
  <button data-event="glitch">Glitch</button>
  <button data-event="chainReaction">Chain Reaction</button>
  <button data-event="cosmicMode">Cosmic Mode</button>
  <button data-event="luckyExplosions">Lucky Explosions</button>
  <button data-event="goldenFirework">Golden Firework</button>
  <button data-event="adminStorm">Admin Storm</button>
</div>

<div id="eventBanner">
  <div id="eventName"></div>
  <div id="eventDesc"></div>
  <div id="eventTimer"></div>
</div>

<audio id="fireworkSound" src="assets/firework.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="game.js"></script>
</body>
</html>
