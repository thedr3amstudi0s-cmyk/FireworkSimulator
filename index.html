<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Firework Simulator</title>
  <style>
    /* Full-screen canvas */
    html,body { height:100%; margin:0; }
    canvas { display:block; background: #0b0f1a; width:100%; height:100%; }

    /* Top-right control area */
    #topRightControls {
      position: fixed;
      top: 12px;
      right: 12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      z-index: 10000;
      font-family: Arial, sans-serif;
    }
    .panel {
      background: rgba(255,255,255,0.06);
      border-radius:8px;
      padding:8px;
      color: #fff;
      min-width: 200px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .panel small { color: #ddd; display:block; margin-bottom:6px; }
    button { background:#1e90ff; border:0; padding:6px 8px; border-radius:6px; color:#fff; cursor:pointer; }
    button.secondary { background:#333; }
    .row { display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
    .stat { font-weight:700; }
    label { font-size:12px; color:#ddd; }

    /* login box (simple) */
    #loginBox { position: fixed; left: 12px; top: 12px; z-index:9999; }
    input[type="text"], input[type="password"], input[type="email"] { padding:6px; border-radius:6px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.02); color:#fff; }
    #loginMsg { color:#ffb; font-size:13px; margin-top:6px; }

    /* owner commands hidden by default */
    #ownerCommands { display:none; margin-top:6px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <!-- Top-right UI / Controls -->
  <div id="topRightControls">
    <div id="ui" class="panel" style="display:none;">
      <small>Stats</small>
      <div class="row">
        <div>Money: <span id="money" class="stat">0</span></div>
        <div> x<span id="moneyMultiplier">1</span></div>
      </div>
      <div class="row">
        <div>Delay: <span id="delayDisplay">1200</span>ms</div>
        <div>Auto speed: <span id="autoSpeedDisplay">2.50</span>s</div>
      </div>
      <div class="row">
        <div>Colors: <span id="unlockedColors">1</span></div>
      </div>

      <div class="row">
        <button id="buyColor">Buy Color</button>
        <button id="reduceDelay" class="secondary">Reduce Delay</button>
      </div>
      <div class="row">
        <button id="buyAuto">Buy Auto</button>
        <button id="rebirth">Rebirth</button>
      </div>

      <div class="row">
        <button id="giveMoneyBtn" class="secondary">+1000</button>
        <button id="unlockColorsBtn" class="secondary">Unlock All Colors</button>
        <button id="maxAutoBtn" class="secondary">Max Auto</button>
      </div>

      <div style="margin-top:6px;">
        <button id="goLeaderboardBtn">Leaderboard</button>
      </div>
    </div>

    <!-- Buttons that must be top-right (logout / reset) -->
    <div class="panel">
      <div class="row">
        <button id="logoutBtn">Logout</button>
        <button id="resetBtn" class="secondary">Reset Progress</button>
      </div>
      <div id="ownerCommands">
        <small>Owner Commands</small>
        <div class="row">
          <button id="adminStormBtn">Admin Storm</button>
          <button id="adminGiveMoneyBtn" class="secondary">Give Money</button>
          <button id="adminToggleRainbowBtn" class="secondary">Toggle Rainbow</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Simple login box (left-top) -->
  <div id="loginBox" class="panel">
    <small>Login / Sign up</small>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <input id="email" type="email" placeholder="email" />
      <input id="password" type="password" placeholder="password" />
      <input id="username" type="text" placeholder="username (signup)" />
      <div style="display:flex;gap:8px;">
        <button id="loginBtn">Login</button>
        <button id="signupBtn" class="secondary">Sign Up</button>
        <button id="forgotBtn" class="secondary">Forgot</button>
      </div>
      <div id="loginMsg"></div>
    </div>
  </div>

  <!-- audio -->
  <audio id="fireworkSound" src="" preload="auto"></audio>

  <!-- Firebase (v8 style used by your original code) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- Your game script -->
  <script src="game.js"></script>
</body>
</html>
