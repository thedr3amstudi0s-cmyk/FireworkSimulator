<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; font-family: Arial, sans-serif; background:#000; }
canvas { display:block; background: radial-gradient(circle at bottom, #0a0a0a, #000); }

/* Login UI */
#loginBox { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#222; padding:30px; border-radius:10px; color:white; z-index:200;}
#loginBox input, #loginBox button { display:block; margin:8px 0; padding:10px; width:240px; border-radius:5px; border:none; }
#loginBox button { background:cyan; color:black; font-weight:bold; cursor:pointer; }
#loginBox button:hover { background:#0ff; }

/* Game UI */
#ui{position:fixed; top:10px; left:10px; color:white; z-index:100;}
#ui button{margin:2px; padding:5px 8px; font-size:14px; cursor:pointer;}
#ownerCommands{margin-top:8px; display:none;}
#cooldownBar{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:280px; height:18px; background:rgba(255,255,255,0.25); border-radius:9px;}
#cooldownFill{height:100%; width:0%; background:limegreen; transition:width 0.05s;}
#resetBtn{position:fixed; top:10px; right:10px; padding:5px 8px; background:red; color:white; border:none; border-radius:5px; display:none;}
body, button, input, p, span { user-select: none; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="loginBox">
  <h2 style="text-align:center;color:#0ff;">Firework Simulator</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <button id="forgotBtn" style="background:#444;color:white;">Forgot Password?</button>
  <p id="loginMsg" style="color:yellow;"></p>
</div>

<div id="ui" style="display:none;">
  <h2>Money: $<span id="money">0</span></h2>
  <button id="buyColor">Buy Color ($<span id="colorPrice">50</span>)</button>
  <button id="reduceDelay">Reduce Delay ($<span id="delayPrice">100</span>)</button>
  <button id="rebirth">Rebirth ($<span id="rebirthPrice">500</span>)</button>
  <button id="buyAuto">Buy Auto-Launch ($<span id="autoPrice">200</span>)</button>
  <button id="goLeaderboardBtn">Open Leaderboard</button>
  <p>Unlocked Colors: <span id="unlockedColors">1</span></p>
  <p>Click Delay: <span id="delayDisplay">1200</span> ms</p>
  <p>Firework Money Multiplier: x<span id="moneyMultiplier">1</span></p>
  <p>Auto Speed: <span id="autoSpeedDisplay">2.50</span> sec</p>
  <div id="ownerCommands"><h3>Owner</h3>
    <button id="giveMoneyBtn">Give $1000</button>
    <button id="unlockColorsBtn">Unlock All Colors</button>
    <button id="maxAutoBtn">Max Auto-Launch</button>
    <button id="viewUsersBtn">View Users</button>
    <button id="adminFireworkBtn">Mega Firework (Admin Event)</button>
    <button id="adminFireworkBtnNuke">Nuke (Admin Event)</button>
  </div>
</div>

<button id="resetBtn">Reset Progress</button>
<button id="logoutBtn" style="position:fixed; top:50px; right:10px; padding:5px 8px; background:orange; color:white; border:none; border-radius:5px;">Logout</button>
<div id="cooldownBar"><div id="cooldownFill"></div></div>
<audio id="fireworkSound" src="assets/single-firework-79814.mp3"></audio>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// -------- FIREBASE CONFIG --------
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

// -------- ADMIN SYSTEM --------
const ADMIN_UIDS = {
  "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true
  // Add more UIDs here for more admins
};

function isAdmin(user) {
  return !!(user && ADMIN_UIDS[user.uid]);
}

// -------- GLOBAL VARIABLES --------
let currentUser = "";
let money = 0, unlockedColors = 1, clickDelay = 1200, lastClick = Date.now();
let rebirthCount = 0, colorPrice = 50, delayPrice = 100, rebirthPrice = 500;
let autoAmount = 0, autoSpeed = 2.5, autoPrice = 200;
let fireworks = [], particles = [];
let autoInterval = null;

let lastAdminTimestamp = Number(localStorage.getItem("lastAdminTimestamp")) || 0;

// -------- COLORS --------
const baseColors = [
  { color: "hsl(0,100%,60%)", value: 1 },
  { color: "hsl(30,100%,60%)", value: 2 },
  { color: "hsl(60,100%,60%)", value: 3 },
  { color: "hsl(120,100%,60%)", value: 4 },
  { color: "hsl(180,100%,60%)", value: 5 },
  { color: "hsl(240,100%,60%)", value: 6 }
];

let colors = [...baseColors];

function getRebirthColors(rebirthCount) {
  const scheme = [{ base: 60 }, { base: 80 }, { base: 100 }, { base: 120 }][rebirthCount % 4];
  const numColors = Math.min(10 + rebirthCount, 50);
  let newColors = [];
  for (let i = 0; i < numColors; i++) {
    const hue = Math.random() * 360;
    newColors.push({ color: `hsl(${hue},${scheme.base}%,60%)`, value: i + 1 });
  }
  return newColors;
}

// -------- CANVAS --------
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;
window.addEventListener("resize", () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
});

// -------- IN-GAME NOTIFICATIONS --------
const notifContainer = document.createElement("div");
notifContainer.id = "notifications";
notifContainer.style.cssText = `
  position: fixed; top: 20px; right: 20px; width: 250px; z-index: 9999;
`;
document.body.appendChild(notifContainer);

function showNotification(message, duration = 3000) {
  const notif = document.createElement("div");
  notif.textContent = message;
  notif.style.cssText = `
    background: rgba(0,0,0,0.8);
    color: #0ff;
    padding: 8px 12px;
    margin-top: 6px;
    border-radius: 6px;
    font-family: Arial;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
  `;
  notifContainer.appendChild(notif);
  requestAnimationFrame(() => notif.style.opacity = 1);
  setTimeout(() => {
    notif.style.opacity = 0;
    setTimeout(() => notifContainer.removeChild(notif), 300);
  }, duration);
}

// -------- PLAYER RANKS --------
function getPlayerRank(rebirthCount, money) {
  if (rebirthCount >= 10) return "Streamer";
  if (rebirthCount >= 5) return "YouTuber";
  if (money >= 10000) return "Popular";
  return "Novice";
}

function updateRankDisplay() {
  const rank = getPlayerRank(rebirthCount, money);
  document.getElementById("rankDisplay").textContent = rank;
}

// -------- FIREWORK LOGIC --------
class Firework {
  constructor(x, y, colorObj) {
    this.x = x;
    this.y = canvas.height;
    this.targetY = y;
    this.speed = Math.random() * 2 + 4;
    this.colorObj = colorObj;
  }
  update() {
    this.y -= this.speed;
    if (this.y <= this.targetY) {
      explode(this.x, this.y, this.colorObj);
      return true;
    }
    return false;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = this.colorObj.color;
    ctx.fill();
  }
}

class Particle {
  constructor(x, y, colorObj) {
    this.x = x;
    this.y = y;
    this.color = colorObj.color;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.life = 100;
  }
  update() {
    this.vy += 0.04;
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

function explode(x, y, colorObj) {
  for (let i = 0; i < 80; i++) particles.push(new Particle(x, y, colorObj));
  money += colorObj.value * (rebirthCount + 1);
  document.getElementById("money").textContent = money;
  updateRankDisplay();
  showNotification(`+${colorObj.value * (rebirthCount + 1)} money`);
  saveProgressOnline();
}

function launchFirework(x, y) {
  const colorIndex = Math.floor(Math.random() * unlockedColors);
  const colorObj = colors[colorIndex];
  fireworks.push(new Firework(x, y, colorObj));
  lastClick = Date.now();
}

// Click to launch
document.addEventListener("click", e => {
  if (Date.now() - lastClick >= clickDelay) {
    launchFirework(e.clientX, e.clientY);
  }
});

// Auto-launch
function startAutoLaunch() {
  if (autoInterval) clearInterval(autoInterval);
  if (autoAmount > 0)
    autoInterval = setInterval(() => {
      launchFirework(Math.random() * canvas.width, Math.random() * canvas.height / 2);
    }, autoSpeed * 1000);
}

// Animation loop
function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  fireworks = fireworks.filter(f => !f.update());
  fireworks.forEach(f => f.draw());

  particles = particles.filter(p => {
    p.update();
    p.draw();
    return p.life > 0;
  });

  requestAnimationFrame(animate);
}
animate();

// -------- ADMIN EVENTS --------
function sendAdminEvent(type, message) {
  const user = auth.currentUser;
  if (!isAdmin(user)) {
    showNotification("Not authorized");
    return;
  }
  db.ref("adminEvents/latest").set({
    type,
    message,
    timestamp: Date.now(),
    by: user.uid
  });
}

adminFireworkBtn.onclick = () => sendAdminEvent("megaFirework", "An admin launched a mega firework!");
adminFireworkBtnNuke.onclick = () => sendAdminEvent("NUKE", "⚠️ ADMIN NUKE ⚠️");

db.ref("adminEvents/latest").on("value", snapshot => {
  const event = snapshot.val();
  if (!event || event.timestamp <= lastAdminTimestamp) return;

  lastAdminTimestamp = event.timestamp;
  localStorage.setItem("lastAdminTimestamp", lastAdminTimestamp);

  const count = event.type === "NUKE" ? 200 : 20;
  for (let i = 0; i < count; i++) launchFirework(Math.random() * canvas.width, Math.random() * canvas.height / 2);

  showNotification(event.message);
});

// -------- ONLINE SAVE/LOAD --------
async function saveProgressOnline() {
  if (!currentUser) return;
  const progress = { money, unlockedColors, clickDelay, rebirthCount, rebirthPrice, colorPrice, delayPrice, autoAmount, autoSpeed };
  await db.ref("progress/" + currentUser).set(progress);
}

async function loadProgressOnline() {
  if (!currentUser) return;
  const snap = await db.ref("progress/" + currentUser).once("value");
  const p = snap.val();
  if (p) {
    money = p.money || 0;
    unlockedColors = p.unlockedColors || 1;
    clickDelay = p.clickDelay || 1200;
    rebirthCount = p.rebirthCount || 0;
    rebirthPrice = p.rebirthPrice || 500;
    colorPrice = p.colorPrice || 50;
    delayPrice = p.delayPrice || 100;
    autoAmount = p.autoAmount || 0;
    autoSpeed = p.autoSpeed || 2.5;
    colors = [...baseColors, ...getRebirthColors(rebirthCount)];
    if (unlockedColors > colors.length) unlockedColors = colors.length;
    document.getElementById("money").textContent = money;
    updateRankDisplay();
    startAutoLaunch();
  }
}
</script>
</body>
</html>
