<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seasonal Leaderboard & Quests</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    margin: 0;
    display: flex;
  }

  /* Leaderboard styling */
  #leaderboardContainer {
    width: 300px;
    min-width: 300px;
    background: #1a1a1a;
    padding: 20px;
    height: 100vh;
    overflow-y: auto;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
  }
  #leaderboardContainer h2 {
    text-align: center;
    margin-bottom: 15px;
    color: #0ff;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: left; border-bottom: 1px solid #333; font-size: 14px; }
  th { background: #222; }
  tr:nth-child(even) { background: #1c1c1c; }
  .tag.owner { color: orange; font-weight: bold; }
  .tag.vip { color: gold; font-weight: bold; }
  .tag.streamer { color: #981ab6; font-weight: bold; }
  .tag.fart { color: #FF4DEE; font-weight: bold; }
  .tag.donator { color: #0BBF06; font-weight: bold; }
  .tag.youtuber { color: #F00000; font-weight: bold; }
  .tag.regular { color: #0ff; }
  #loading { text-align: center; margin-top: 20px; font-size: 14px; color: #0ff; }

  /* Main content (quests) */
  #mainContent {
    flex: 1;
    padding: 20px;
  }
  #questsContainer h2 {
    text-align: center;
    margin-bottom: 10px;
    color: #0ff;
  }
  .quest {
    background: #1c1c1c;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 6px;
  }
  .quest button {
    margin-top: 5px;
    background: #0ff;
    border: none;
    color: #111;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 4px;
  }
  .quest button:hover {
    background: #0aa;
  }
</style>
</head>
<body>

<div id="leaderboardContainer">
  <h2>Leaderboard</h2>
  <div id="loading">Loading leaderboard...</div>
  <table id="leaderboard" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Tag</th>
        <th>Username</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody"></tbody>
  </table>
</div>

<div id="mainContent">
  <div id="questsContainer">
    <h2>Quests</h2>
    <div id="questsList"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// --- Firebase Config ---
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1",
  measurementId: "G-H07BZY385S"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- Leaderboard Variables ---
const OWNER_UIDS = { "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true };
const TAGS = {
  owner: { name: "Owner", class: "owner" },
  vip: { name: "VIP", class: "vip" },
  streamer: { name: "STREAMER", class: "streamer" },
  fart: { name: "Fart", class: "fart" },
  donator: { name: "DONATOR", class: "donator" },
  youtuber: { name: "YOUTUBER", class: "youtuber" },
  regular: { name: "Regular", class: "regular" },
};

const body = document.getElementById('leaderboardBody');
const loading = document.getElementById('loading');

let scores = {}, usernames = {}, users = {}, admins = {}, activeTags = {}, questProgress = {};

// --- Format Scores ---
function formatScore(num) {
  if (num >= 1_000_000_000) return (num / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + 'B';
  if (num >= 1_000_000) return (num / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (num >= 1_000) return (num / 1_000).toFixed(1).replace(/\.0$/, '') + 'k';
  return num;
}

// --- Build Leaderboard ---
function buildLeaderboard() {
  body.innerHTML = '';

  const uids = new Set([...Object.keys(scores||{}), ...Object.keys(usernames||{}), ...Object.keys(users||{})]);
  const data = [];

  uids.forEach(uid => {
    const score = scores[uid]?.score || 0;
    const uname = usernames[uid] || users[uid]?.username || 'Unknown';
    let tag = 'regular';
    if(admins[uid] || OWNER_UIDS[uid]) tag = 'owner';
    else if(activeTags[uid]) tag = activeTags[uid];
    data.push({ uid, score, uname, tag });
  });

  data.sort((a,b) => b.score - a.score);

  data.forEach((u,i) => {
    const tr = document.createElement('tr');
    tr.dataset.uid = u.uid;
    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="tag ${TAGS[u.tag]?.class || 'regular'}">${TAGS[u.tag]?.name || 'Regular'}</td>
      <td>${u.uname}</td>
      <td>${formatScore(u.score)}</td>
    `;
    body.appendChild(tr);
  });

  loading.style.display = 'none';
  document.getElementById('leaderboard').style.display = 'table';
}

// --- Active Quests Setup ---
const quests = [
  { id: "launch100", description: "Launch 100 fireworks", goal: 100, reward: 50 },
  { id: "reachVIP", description: "Get VIP tag", goal: 1, reward: 100 },
  { id: "youtuberScore", description: "Reach 1,000 score as YOUTUBER", goal: 1000, reward: 75 },
];

// Render quests for a specific player
function renderQuests(uid) {
  const container = document.getElementById('questsList');
  container.innerHTML = '';

  quests.forEach(q => {
    const progress = (questProgress[uid]?.[q.id] || 0);
    const completed = progress >= q.goal;
    const div = document.createElement('div');
    div.className = 'quest';
    div.innerHTML = `
      <strong>${q.description}</strong><br>
      Progress: ${progress}/${q.goal} 
      ${completed ? '✅ Completed' : ''}
      ${!completed ? `<button onclick="completeQuest('${uid}','${q.id}')">Complete Now</button>` : ''}
    `;
    container.appendChild(div);
  });
}

// Complete a quest
function completeQuest(uid, questId) {
  const quest = quests.find(q => q.id === questId);
  if(!quest) return;

  db.ref(`questProgress/${uid}/${questId}`).set(quest.goal);

  const currentScore = scores[uid]?.score || 0;
  db.ref(`scores/${uid}/score`).set(currentScore + quest.reward);
}

// --- Load Initial Data ---
Promise.all([
  db.ref('scores').once('value'),
  db.ref('usernames').once('value'),
  db.ref('users').once('value'),
  db.ref('admins').once('value'),
  db.ref('activeTag').once('value'),
  db.ref('questProgress').once('value')
]).then(([sSnap,uSnap,usSnap,aSnap,tSnap,qSnap])=>{
  scores = sSnap.val()||{};
  usernames = uSnap.val()||{};
  users = usSnap.val()||{};
  admins = aSnap.val()||{};
  activeTags = tSnap.val()||{};
  questProgress = qSnap.val()||{};
  buildLeaderboard();

  // Render quests for current player if logged in
  firebase.auth().onAuthStateChanged(user=>{
    if(user) renderQuests(user.uid);
  });
});

// --- Listen for Realtime Updates ---
['scores','usernames','users','admins','activeTag','questProgress'].forEach(path=>{
  db.ref(path).on('value', snap=>{
    if(path==='scores') scores = snap.val()||{};
    if(path==='usernames') usernames = snap.val()||{};
    if(path==='users') users = snap.val()||{};
    if(path==='admins') admins = snap.val()||{};
    if(path==='activeTag') activeTags = snap.val()||{};
    if(path==='questProgress') questProgress = snap.val()||{};
    buildLeaderboard();

    const user = firebase.auth().currentUser;
    if(user) renderQuests(user.uid);
  });
});
</script>
</body>
</html>
