<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Seasonal Leaderboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    margin: 0;
    display: flex;
  }

  /* Sidebar leaderboard */
  #leaderboardContainer {
    width: 300px;
    min-width: 300px;
    background: #1a1a1a;
    padding: 20px;
    height: 100vh;
    overflow-y: auto;
    box-shadow: 2px 0 10px rgba(0,0,0,0.5);
  }

  #leaderboardContainer h2 {
    text-align: center;
    margin-bottom: 15px;
    color: #0ff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 8px;
    text-align: left;
    border-bottom: 1px solid #333;
    font-size: 14px;
  }

  th {
    background: #222;
  }

  tr:nth-child(even) {
    background: #1c1c1c;
  }

  .tag.owner { color: orange; font-weight: bold; }
  .tag.vip { color: gold; font-weight: bold; }
  .tag.streamer { color: #981ab6; font-weight: bold; }
  .tag.fart { color: #FF4DEE; font-weight: bold; }
  .tag.donator { color: #0BBF06; font-weight: bold; }
  .tag.youtuber { color: #F00000; font-weight: bold; }
  .tag.regular { color: #0ff; }

  #loading {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #0ff;
  }

  /* Main content area */
  #mainContent {
    flex: 1;
    padding: 20px;
  }
</style>
</head>
<body>

<div id="leaderboardContainer">
  <h2>Leaderboard</h2>
  <div id="loading">Loading leaderboard...</div>
  <table id="leaderboard" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Tag</th>
        <th>Username</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody"></tbody>
  </table>
</div>

<div id="mainContent">
  <!-- Your seasonal content goes here -->
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Fallback for owner UIDs
const OWNER_UIDS = { "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true };

// Tag definitions
const TAGS = {
  owner: { name: "Owner", class: "owner" },
  vip: { name: "VIP", class: "vip" },
  streamer: { name: "STREAMER", class: "streamer" },
  fart: { name: "Fart", class: "fart" },
  donator: { name: "DONATOR", class: "donator" },
  youtuber: { name: "YOUTUBER", class: "youtuber" },
  regular: { name: "Regular", class: "regular" },
};

const body = document.getElementById('leaderboardBody');
const loading = document.getElementById('loading');

let progress = {}, usernames = {}, users = {}, admins = {}, activeTags = {};

function formatScore(num) {
  if (num >= 1_000_000_000) return (num / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + 'B';
  if (num >= 1_000_000) return (num / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (num >= 1_000) return (num / 1_000).toFixed(1).replace(/\.0$/, '') + 'k';
  return num;
}

function buildLeaderboard() {
  body.innerHTML = '';
  const uids = new Set([
    ...Object.keys(progress || {}),
    ...Object.keys(usernames || {}),
    ...Object.keys(users || {})
  ]);

  const data = [];
  uids.forEach(uid => {
    const score = progress[uid]?.score || 0;
    const uname = usernames[uid] || users[uid]?.username || 'Unknown';

    let tag = 'regular';
    if (admins[uid] || OWNER_UIDS[uid]) tag = 'owner';
    else if (activeTags[uid]) tag = activeTags[uid];

    data.push({ uid, score, uname, tag });
  });

  data.sort((a,b) => b.score - a.score);

  data.forEach((u,i) => {
    const tr = document.createElement('tr');
    tr.dataset.uid = u.uid;
    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="tag ${TAGS[u.tag]?.class || 'regular'}">${TAGS[u.tag]?.name || 'Regular'}</td>
      <td>${u.uname}</td>
      <td>${formatScore(u.score)}</td>
    `;
    body.appendChild(tr);
  });

  loading.style.display = 'none';
  document.getElementById('leaderboard').style.display = 'table';
}

// Load initial data
Promise.all([
  db.ref('progress').once('value'),
  db.ref('usernames').once('value'),
  db.ref('users').once('value'),
  db.ref('admins').once('value'),
  db.ref('activeTag').once('value')
]).then(([pSnap, uSnap, usSnap, aSnap, tSnap])=>{
  progress = pSnap.val() || {};
  usernames = uSnap.val() || {};
  users = usSnap.val() || {};
  admins = aSnap.val() || {};
  activeTags = tSnap.val() || {};
  buildLeaderboard();
});

// Listen for changes
['progress','usernames','users','admins','activeTag'].forEach(path => {
  db.ref(path).on('value', snap => {
    if(path==='progress') progress = snap.val()||{};
    if(path==='usernames') usernames = snap.val()||{};
    if(path==='users') users = snap.val()||{};
    if(path==='admins') admins = snap.val()||{};
    if(path==='activeTag') activeTags = snap.val()||{};
    buildLeaderboard();
  });
});
</script>
</body>
</html>
