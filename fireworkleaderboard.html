<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator Leaderboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color:#fff; margin:0; padding:20px; }
  table { border-collapse: collapse; width:100%; max-width:800px; margin:auto; background:#222; }
  th, td { border:1px solid #555; padding:8px 12px; text-align:center; }
  th { background:#333; }
  .rank-tag { padding:2px 6px; border-radius:4px; font-weight:700; color:#fff; }
  .Owner { background:#ff0066; }
  .Admin { background:#00ccff; }
  .Player { background:#888; }
</style>
</head>
<body>
<h1 style="text-align:center;">Firework Simulator Leaderboard</h1>
<div id="loading" style="text-align:center; margin:20px;">Loading leaderboard...</div>
<table id="leaderboard" style="display:none;">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Tag</th>
      <th>Username</th>
      <th>Money</th>
    </tr>
  </thead>
  <tbody>
    <!-- rows injected here -->
  </tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// fallback tags
const TAG_FALLBACK = {
  "FaZgGtIHzVcnSS6c8JAoir9RG8J2": "Owner",
  "BxQ1aTqPndOfHzuX3OzlCcD4pbC3": "Admin"
};

async function loadLeaderboard(){
  const loading = document.getElementById('loading');
  const tbody = document.querySelector('#leaderboard tbody');
  try {
    const scoresSnap = await db.ref('progress').once('value'); // <-- use "progress" path
    const scores = scoresSnap.val() || {};
    if(Object.keys(scores).length === 0) throw new Error('No scores found');

    const usersSnap = await db.ref('usernames').once('value');
    const usernames = usersSnap.val() || {};

    const adminsSnap = await db.ref('admins').once('value');
    const admins = adminsSnap.val() || {};

    tbody.innerHTML = '';
    const scoreArray = [];

    for(const uid in scores){
      const s = scores[uid];
      const uname = usernames[uid] || 'Unknown';
      let tag = 'Player';
      if(admins && admins[uid]) tag = 'Admin';
      else if(TAG_FALLBACK[uid]) tag = TAG_FALLBACK[uid];
      scoreArray.push({uid, uname, money: s.money || 0, tag});
    }

    scoreArray.sort((a,b)=>b.money - a.money);

    scoreArray.forEach((user,index)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index+1}</td>
        <td><span class="rank-tag ${user.tag}">${user.tag}</span></td>
        <td>${user.uname}</td>
        <td>$${user.money}</td>
      `;
      tbody.appendChild(tr);
    });

    loading.style.display = 'none';
    document.getElementById('leaderboard').style.display = 'table';
  } catch(e){
    console.error(e);
    loading.textContent = 'Error loading leaderboard. Check DB paths & rules.';
  }
}

loadLeaderboard();
</script>
</body>
</html>
