<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Leaderboard</title>
<style>
body { margin:0; padding:0; font-family:Arial, sans-serif; background: radial-gradient(circle at top, #000, #0a0a0a); color:white; text-align:center; }
h1 { margin-top:20px; color:#0ff; }
table { margin:20px auto; border-collapse:collapse; width:80%; max-width:600px; }
th, td { border:1px solid #0ff; padding:10px; }
th { background:#111; }
td { background:#222; }
button { padding:10px 20px; margin:10px; font-size:16px; cursor:pointer; border:none; border-radius:5px; background:cyan; color:#000; font-weight:bold; }
button:hover { background:#0ff; }
</style>
</head>
<body>

<h1>Firework Simulator Leaderboard</h1>
<table>
  <thead>
    <tr>
      <th>Username</th>
      <th>Money</th>
      <th>Rebirths</th>
    </tr>
  </thead>
  <tbody id="leaderboardBody">
    <tr><td colspan="3">Loading leaderboard...</td></tr>
  </tbody>
</table>

<button onclick="goBack()">Back to Game</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ---------- FIREBASE ----------
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com/",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1",
  measurementId: "G-H07BZY385S"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------- GET LEADERBOARD ----------
function loadLeaderboard(){
    const tbody = document.getElementById("leaderboardBody");
    tbody.innerHTML = "<tr><td colspan='3'>Loading...</td></tr>";
    db.ref("players").once("value").then(snapshot=>{
        const data = snapshot.val();
        if(!data){ tbody.innerHTML="<tr><td colspan='3'>No data yet</td></tr>"; return; }

        // Convert object to array and sort by money descending
        const players = Object.entries(data).map(([username, info])=>({username, money:info.money||0, rebirths:info.rebirths||0}));
        players.sort((a,b)=>b.money - a.money);

        tbody.innerHTML = "";
        players.forEach(p=>{
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${p.username}</td><td>${p.money}</td><td>${p.rebirths}</td>`;
            tbody.appendChild(tr);
        });
    });
}

// ---------- BACK BUTTON ----------
function goBack(){ window.location.href="index.html"; }

window.onload = loadLeaderboard;
</script>

</body>
</html>
