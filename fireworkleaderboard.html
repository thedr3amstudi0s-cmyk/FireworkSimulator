<script>
// ---------- LEADERBOARD ----------
const tbody = document.querySelector("#leaderboard tbody");

function loadLeaderboard() {
    db.ref("scores").once("value").then(scoreSnap => {
        const scores = scoreSnap.val();
        if (!scores) {
            tbody.innerHTML = '<tr><td colspan="3">No scores yet!</td></tr>';
            return;
        }

        // Get all user UIDs
        const userIds = Object.keys(scores);

        // Fetch usernames for all users
        const promises = userIds.map(uid => 
            db.ref("users/" + uid + "/username").once("value")
            .then(nameSnap => ({
                uid,
                username: nameSnap.exists() ? nameSnap.val() : uid,
                money: scores[uid].money || 0
            }))
        );

        Promise.all(promises).then(users => {
            // Sort by money descending
            users.sort((a,b)=>b.money - a.money);

            // Render table
            tbody.innerHTML = "";
            users.forEach((item,index)=>{
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${index+1}</td><td>${item.username}</td><td>$${item.money}</td>`;
                tbody.appendChild(tr);
            });
        });
    });
}

// Load on start
loadLeaderboard();

// Auto-refresh every 10 seconds
setInterval(loadLeaderboard, 10000);
</script>
