<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator Leaderboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #fff; margin:0; padding:20px; }
  h1 { text-align:center; margin-bottom:20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
  th { background: #222; }
  tr:nth-child(even) { background: #1a1a1a; }
  button { padding: 2px 6px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; }

  .tag.owner { color: orange; font-weight: bold; }
  .tag.vip { color: gold; font-weight: bold; }
  .tag.streamer { color: #981ab6; font-weight: bold; }
  .tag.regular { color: #0ff; }
  #loading { text-align:center; margin-top:50px; font-size:18px; color:#0ff; }
</style>
</head>
<body>

<h1>Leaderboard</h1>
<div id="loading">Loading leaderboard...</div>

<table id="leaderboard" style="display:none;">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Tag</th>
      <th>Username</th>
      <th>Money</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="leaderboardBody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// Owner fallback UID
const OWNER_UIDS = { "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true };

// Tag definitions
const TAGS = {
  owner: { name: "Owner", class: "owner" },
  vip: { name: "VIP", class: "vip" },
  streamer: { name: "STREAMER", class: "streamer" },
  regular: { name: "Regular", class: "regular" }
};

let currentUserUID = null;

// Wait for auth
auth.onAuthStateChanged(user => {
  if(user) {
    currentUserUID = user.uid;
    loadLeaderboard();
    listenTagChanges();
  } else {
    currentUserUID = null;
    document.getElementById('loading').textContent = 'Please log in to view leaderboard.';
  }
});

// Load leaderboard
async function loadLeaderboard() {
  const body = document.getElementById('leaderboardBody');
  body.innerHTML = '';

  try {
    const [
      progressSnap,
      usernamesSnap,
      usersSnap,
      adminsSnap,
      activeTagSnap
    ] = await Promise.all([
      db.ref('progress').once('value'),
      db.ref('usernames').once('value'),
      db.ref('users').once('value'),
      db.ref('admins').once('value'),
      db.ref('activeTag').once('value')
    ]);

    const progress = progressSnap.val() || {};
    const usernames = usernamesSnap.val() || {};
    const users = usersSnap.val() || {};
    const admins = adminsSnap.val() || {};
    const activeTags = activeTagSnap.val() || {};

    const uids = new Set([...Object.keys(progress), ...Object.keys(usernames), ...Object.keys(users)]);
    const data = [];

    uids.forEach(uid => {
      const money = progress[uid]?.money ?? 0;
      let uname = usernames[uid] ?? users[uid]?.username ?? 'Unknown';
      let tag = 'regular';
      if(admins[uid] || OWNER_UIDS[uid]) tag = 'owner';
      else if(activeTags[uid]) tag = activeTags[uid];
      data.push({ uid, money, uname, tag });
    });

    data.sort((a,b) => b.money - a.money);

    data.forEach((u,i) => {
      const tr = document.createElement('tr');
      tr.dataset.uid = u.uid;

      const tagName = TAGS[u.tag]?.name || 'Regular';
      const tagClass = TAGS[u.tag]?.class || 'regular';
      tr.innerHTML = `
        <td>${i+1}</td>
        <td class="tag ${tagClass}">${tagName}</td>
        <td>${u.uname}</td>
        <td>${u.money}</td>
        <td></td>
      `;
      const actionCell = tr.querySelector('td:last-child');

      // Equip/unequip only for current logged-in owner
      if(u.uid === currentUserUID){
        const equipBtn = document.createElement('button');
        if(activeTags[u.uid] === u.tag){
          equipBtn.textContent = 'Unequip';
        } else {
          equipBtn.textContent = 'Equip';
        }
        equipBtn.onclick = async () => {
          if(activeTags[u.uid] === u.tag){
            await db.ref(`activeTag/${u.uid}`).remove();
            showNotification(`Unequipped ${tagName}`);
          } else {
            await db.ref(`activeTag/${u.uid}`).set(u.tag);
            showNotification(`Equipped ${tagName}`);
          }
        };
        actionCell.appendChild(equipBtn);
      }

      body.appendChild(tr);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('leaderboard').style.display = 'table';
  } catch(e) {
    console.error(e);
    document.getElementById('loading').textContent = 'Error loading leaderboard. Check DB paths & rules.';
  }
}

// Listen for activeTag changes and update table live
function listenTagChanges(){
  db.ref('activeTag').on('value', snap => {
    const activeTags = snap.val() || {};
    const rows = document.querySelectorAll('#leaderboardBody tr');
    rows.forEach(row => {
      const uid = row.dataset.uid;
      const tagCell = row.children[1];
      const actionCell = row.children[4];
      const currentTag = tagCell.textContent;

      let newTag = 'Regular';
      let tagClass = 'regular';
      if(activeTags[uid]){
        newTag = TAGS[activeTags[uid]]?.name || 'Regular';
        tagClass = TAGS[activeTags[uid]]?.class || 'regular';
      } else if(OWNER_UIDS[uid]){
        newTag = 'Owner';
        tagClass = 'owner';
      }

      tagCell.textContent = newTag;
      tagCell.className = 'tag ' + tagClass;

      // Update equip button text for current owner
      if(uid === currentUserUID && actionCell.firstChild){
        const btn = actionCell.firstChild;
        if(activeTags[uid] === activeTags[uid]){
          btn.textContent = 'Unequip';
        } else {
          btn.textContent = 'Equip';
        }
      }
    });
  });
}

// Simple notification
function showNotification(msg){
  alert(msg); // quick alert for demo; replace with nicer UI if desired
}
</script>
</body>
</html>
