<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Leaderboard</title>
<style>
body {
  background:#0a0a0a;
  color:white;
  font-family:Arial, sans-serif;
  padding:20px;
}
h1 { color:#0ff; text-align:center; }
table {
  width:100%;
  border-collapse: collapse;
  margin-top:20px;
}
th, td {
  padding:10px;
  border-bottom:1px solid #444;
  text-align:left;
}
th { color:#0ff; }
button {
  margin-top:20px;
  padding:6px 12px;
  cursor:pointer;
  background:#0ff;
  color:black;
  border:none;
  border-radius:5px;
  font-weight:bold;
}
</style>
</head>

<body>
<h1>🔥 Firework Leaderboard 🔥</h1>

<table id="leaderboardTable">
<tr>
  <th>Rank</th>
  <th>Username</th>
  <th>Money</th>
</tr>
</table>

<button onclick="loadLeaderboard()">Refresh</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

async function loadLeaderboard() {
  const table = document.getElementById("leaderboardTable");
  table.querySelectorAll("tr:not(:first-child)").forEach(r => r.remove());

  try {
    // Get progress (money)
    const progressSnap = await db.ref("progress").once("value");
    const progress = progressSnap.val() || {};

    // Get users (names)
    const usersSnap = await db.ref("users").once("value");
    const users = usersSnap.val() || {};

    const leaderboard = [];

    for (const uid in progress) {
      leaderboard.push({
        username: users[uid]?.username || "Unknown",
        money: progress[uid].money || 0
      });
    }

    // Sort highest money first
    leaderboard.sort((a, b) => b.money - a.money);

    leaderboard.forEach((player, i) => {
      const row = table.insertRow();
      row.insertCell(0).textContent = i + 1;
      row.insertCell(1).textContent = player.username;
      row.insertCell(2).textContent = player.money.toLocaleString();
    });

  } catch (err) {
    console.error("Leaderboard error:", err);
    alert("Leaderboard failed — check console");
  }
}

loadLeaderboard();
</script>
</body>
</html>
