<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator Leaderboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #fff; margin:0; padding:20px; }
  h1 { text-align:center; margin-bottom:20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
  th { background: #222; }
  tr:nth-child(even) { background: #1a1a1a; }
  .tag.owner { color: orange; font-weight: bold; }
  .tag.regular { color: #0ff; }
  .tag.vip { color: gold; font-weight: bold; }
  #loading { text-align:center; margin-top:50px; font-size:18px; color:#0ff; }
</style>
</head>
<body>

<h1>Leaderboard</h1>
<div id="loading">Loading leaderboard...</div>
<table id="leaderboard" style="display:none;">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Tag</th>
      <th>Username</th>
      <th>Money</th>
    </tr>
  </thead>
  <tbody id="leaderboardBody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ===== owner UID fallback ===== */
const OWNER_UIDS = {
  "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true
};

/* ===== tag colors & names ===== */
const TAGS = {
  owner: { name: "Owner", class: "owner" },
  vip: { name: "VIP", class: "vip" },
  regular: { name: "Regular", class: "regular" }
};

async function loadLeaderboard(){
  const lbBody = document.getElementById('leaderboardBody');
  lbBody.innerHTML = '';
  try {
    const progressSnap = await db.ref('progress').once('value');
    const scoresSnap = await db.ref('scores').once('value');
    const usernamesSnap = await db.ref('usernames').once('value');
    const usersSnap = await db.ref('users').once('value'); // <-- merged
    const adminsSnap = await db.ref('admins').once('value');

    const progress = progressSnap.val() || {};
    const scores = scoresSnap.val() || {};
    const usernames = usernamesSnap.val() || {};
    const users = usersSnap.val() || {};  // <-- merged
    const admins = adminsSnap.val() || {};

    const uids = new Set([
      ...Object.keys(progress),
      ...Object.keys(scores),
      ...Object.keys(usernames),
      ...Object.keys(users)
    ]);

    const data = [];
    uids.forEach(uid=>{
      const money = progress[uid]?.money ?? 0;
      const uname = usernames[uid] ?? users[uid]?.username ?? 'Unknown';
      let tag = 'regular';
      if(admins[uid]) tag = 'owner';
      else if(OWNER_UIDS[uid]) tag = 'owner';
      data.push({ uid, money, uname, tag });
    });

    data.sort((a,b)=>b.money - a.money);

    data.forEach((d,i)=>{
      const tr = document.createElement('tr');
      const rankTd = document.createElement('td'); rankTd.textContent = i+1;
      const tagTd = document.createElement('td'); tagTd.textContent = TAGS[d.tag].name;
      tagTd.className = 'tag ' + TAGS[d.tag].class;
      const unameTd = document.createElement('td'); unameTd.textContent = d.uname;
      const moneyTd = document.createElement('td'); moneyTd.textContent = d.money;
      tr.appendChild(rankTd);
      tr.appendChild(tagTd);
      tr.appendChild(unameTd);
      tr.appendChild(moneyTd);
      lbBody.appendChild(tr);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('leaderboard').style.display = 'table';

  } catch(e){
    console.error(e);
    document.getElementById('loading').textContent = 'Error loading leaderboard. Check DB paths & rules.';
  }
}

/* load after auth (optional: guest view works) */
loadLeaderboard();
</script>

</body>
</html>
