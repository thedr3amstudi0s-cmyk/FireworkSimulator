<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Leaderboard</title>
<style>
  body { margin:0; font-family:Arial, sans-serif; background:#111; color:#eee; }
  h1 { text-align:center; margin-top:20px; color:#0ff; text-shadow:0 0 6px #000; }
  table { margin:20px auto; border-collapse:collapse; width:80%; max-width:800px; }
  th, td { padding:12px 16px; border-bottom:1px solid #333; text-align:left; }
  th { background:#222; }
  tr:nth-child(even) { background:#1a1a1a; }
  .tag { font-weight:700; padding:2px 6px; border-radius:4px; color:white; }
  .owner { background:gold; color:#000; }
  .vip { background:cyan; color:#000; }
  .regular { background:#555; }
  #loading { text-align:center; margin-top:50px; color:#0f0; }
</style>
</head>
<body>

<h1>Leaderboard</h1>
<div id="loading">Loading leaderboard...</div>
<table id="leaderboard" style="display:none;">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Tag</th>
      <th>Username</th>
      <th>Money</th>
    </tr>
  </thead>
  <tbody id="leaderboardBody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ===== Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== Tag colors =====
const TAGS = {
  owner: { name: 'Owner', class: 'owner' },
  vip: { name: 'VIP', class: 'vip' },
  regular: { name: 'Regular', class: 'regular' }
};

// ===== Fallback for known owner/admin UIDs (optional) =====
const OWNER_UIDS = {
  "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true,
  "BxQ1aTqPndOfHzuX3OzlCcD4pbC3": true
};

// ===== Leaderboard load =====
async function loadLeaderboard(){
  const lbBody = document.getElementById('leaderboardBody');
  lbBody.innerHTML = '';
  try {
    // fetch progress
    const progressSnap = await db.ref('progress').once('value');
    const scoresSnap = await db.ref('scores').once('value');
    const usernamesSnap = await db.ref('usernames').once('value');
    const adminsSnap = await db.ref('admins').once('value');

    const progress = progressSnap.val() || {};
    const scores = scoresSnap.val() || {};
    const usernames = usernamesSnap.val() || {};
    const admins = adminsSnap.val() || {};

    // combine all UIDs into one array
    const uids = new Set([...Object.keys(progress), ...Object.keys(scores), ...Object.keys(usernames)]);

    const data = [];
    uids.forEach(uid=>{
      const money = progress[uid]?.money ?? 0;
      const uname = usernames[uid] ?? 'Unknown';
      let tag = 'regular';
      if(admins[uid]) tag = 'owner';
      else if(OWNER_UIDS[uid]) tag = 'owner'; // fallback owner
      data.push({ uid, money, uname, tag });
    });

    // sort descending by money
    data.sort((a,b)=>b.money - a.money);

    // populate table
    data.forEach((d,i)=>{
      const tr = document.createElement('tr');
      const rankTd = document.createElement('td'); rankTd.textContent = i+1;
      const tagTd = document.createElement('td');
      tagTd.textContent = TAGS[d.tag].name;
      tagTd.className = 'tag ' + TAGS[d.tag].class;
      const unameTd = document.createElement('td'); unameTd.textContent = d.uname;
      const moneyTd = document.createElement('td'); moneyTd.textContent = d.money;
      tr.appendChild(rankTd);
      tr.appendChild(tagTd);
      tr.appendChild(unameTd);
      tr.appendChild(moneyTd);
      lbBody.appendChild(tr);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('leaderboard').style.display = 'table';

  } catch(e){
    console.error(e);
    document.getElementById('loading').textContent = 'Error loading leaderboard. Check DB paths & rules.';
  }
}

// init
loadLeaderboard();
</script>

</body>
</html>
