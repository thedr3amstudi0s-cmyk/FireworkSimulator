<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Leaderboard</title>
<style>
body { background:#0a0a0a; color:white; font-family:Arial; padding:20px; }
h1 { color:#0ff; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th, td { padding:10px; border-bottom:1px solid #444; }
th { color:#0ff; }
</style>
</head>
<body>

<h1>🔥 Firework Leaderboard</h1>

<table id="table">
<tr><th>#</th><th>Username</th><th>Money</th></tr>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

async function loadLeaderboard(){
  const table = document.getElementById("table");

  const snap = await db.ref("progress").once("value");
  const progress = snap.val() || {};

  const rows = [];

  for (const uid in progress) {
    const money = progress[uid]?.money || 0;

    const nameSnap = await db.ref("usernames/"+uid).once("value");
    const username = nameSnap.val() || "Unknown";

    rows.push({ username, money });
  }

  rows.sort((a,b)=>b.money - a.money);

  rows.forEach((r,i)=>{
    const tr = table.insertRow();
    tr.insertCell(0).textContent = i + 1;
    tr.insertCell(1).textContent = r.username;
    tr.insertCell(2).textContent = r.money;
  });
}

loadLeaderboard();
</script>

</body>
</html>
