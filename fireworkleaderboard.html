<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Leaderboard</title>
<style>
  body { margin:0; padding:0; font-family: Arial, sans-serif; background:#111; color:#fff; }
  h1 { text-align:center; margin:20px 0; }
  table { width:80%; margin:20px auto; border-collapse: collapse; }
  th, td { padding:10px; text-align:center; border-bottom:1px solid #444; }
  th { background:#222; }
  tr:nth-child(even) { background:#1a1a1a; }
  .rank-tag { padding:4px 8px; border-radius:6px; font-weight:700; color:#fff; }
  .Owner { background:purple; }
  .Admin { background:red; }
  .Player { background:gray; }
  #loading { text-align:center; margin-top:40px; color:#0ff; }
</style>
</head>
<body>

<h1>Firework Leaderboard</h1>
<div id="loading">Loading leaderboard...</div>
<table id="leaderboard" style="display:none;">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Tag</th>
      <th>Username</th>
      <th>Money</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ================== CONFIG ================== */
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ===== fallback admin/owner tags ===== */
const TAG_FALLBACK = {
  "FaZgGtIHzVcnSS6c8JAoir9RG8J2": "Owner",
  "BxQ1aTqPndOfHzuX3OzlCcD4pbC3": "Admin"
};

/* fetch leaderboard */
async function loadLeaderboard(){
  try {
    const scoresSnap = await db.ref('scores').once('value');
    const scores = scoresSnap.val() || {};
    const tbody = document.querySelector('#leaderboard tbody');
    tbody.innerHTML = '';

    // fetch usernames and tags
    const usersSnap = await db.ref('usernames').once('value');
    const usernames = usersSnap.val() || {};
    
    const adminsSnap = await db.ref('admins').once('value');
    const admins = adminsSnap.val() || {};

    // build array for sorting
    const scoreArray = [];
    for(const uid in scores){
      const s = scores[uid];
      const uname = usernames[uid] || 'Unknown';
      let tag = 'Player';
      if(admins[uid]) tag = 'Admin';
      else if(TAG_FALLBACK[uid]) tag = TAG_FALLBACK[uid];
      scoreArray.push({uid, uname, money: s.money || 0, tag});
    }

    // sort by money descending
    scoreArray.sort((a,b)=>b.money - a.money);

    // populate table
    scoreArray.forEach((user,index)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index+1}</td>
        <td><span class="rank-tag ${user.tag}">${user.tag}</span></td>
        <td>${user.uname}</td>
        <td>$${user.money}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('leaderboard').style.display = 'table';
  } catch(e){
    document.getElementById('loading').textContent = 'Error loading leaderboard';
    console.error(e);
  }
}

loadLeaderboard();
</script>
</body>
</html>
