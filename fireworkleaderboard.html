<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator Leaderboard</title>
<style>
body { margin:0; font-family: Arial, sans-serif; background:#111; color:white; display:flex; flex-direction:column; align-items:center;}
h1 { margin-top:20px; color:#0ff; }
table { border-collapse: collapse; width:80%; max-width:600px; margin-top:20px; }
th, td { border: 1px solid #0ff; padding:10px; text-align:center; }
th { background:#222; }
tr:nth-child(even) { background:#1a1a1a; }
tr:hover { background:#333; }
button { margin-top:20px; padding:10px 20px; font-size:16px; background:cyan; color:#000; border:none; border-radius:5px; cursor:pointer;}
button:hover { background:#0ff; }
</style>
</head>
<body>
<h1>Firework Simulator Leaderboard</h1>
<table id="leaderboard">
<thead>
<tr><th>Rank</th><th>Username</th><th>Money</th></tr>
</thead>
<tbody>
<tr><td colspan="3">Loading...</td></tr>
</tbody>
</table>
<button onclick="window.close()">Close</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// ---------- FIREBASE ----------
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com/",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1",
  measurementId: "G-H07BZY385S"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ---------- LEADERBOARD ----------
const tbody = document.querySelector("#leaderboard tbody");

function loadLeaderboard(){
    db.ref("scores").once("value").then(snapshot => {
        const data = snapshot.val();
        if(!data){ tbody.innerHTML='<tr><td colspan="3">No scores yet!</td></tr>'; return; }
        // Convert to array
        const arr = Object.keys(data).map(user => ({username:user, money:data[user].money||0}));
        arr.sort((a,b)=>b.money-a.money);
        // Render
        tbody.innerHTML = "";
        arr.forEach((item,index)=>{
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${index+1}</td><td>${item.username}</td><td>$${item.money}</td>`;
            tbody.appendChild(tr);
        });
    });
}

// Load on start
loadLeaderboard();

// Auto-refresh every 10 seconds
setInterval(loadLeaderboard, 10000);
</script>
</body>
</html>
