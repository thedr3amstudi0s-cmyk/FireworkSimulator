
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firework Simulator Leaderboard</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #fff; margin:0; padding:20px; }
  h1 { text-align:center; margin-bottom:20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
  th { background: #222; }
  tr:nth-child(even) { background: #1a1a1a; }

  .tag.owner { color: orange; font-weight: bold; }
  .tag.vip { color: gold; font-weight: bold; }
  .tag.streamer { color: #981ab6; font-weight: bold; }
  .tag.fart { color: #FF4DEE; font-weight: bold; }
  .tag.donator { color: #0BBF06; font-weight: bold; }
  .tag.youtuber { color: #F00000; font-weight: bold; }
  .tag.mystery { color: #000000; font-weight: bold; }
  .tag.regular { color: #0ff; }

  #loading { text-align:center; margin-top:50px; font-size:18px; color:#0ff; }
</style>
</head>
<body>

<h1>Leaderboard</h1>
<div id="loading">Loading leaderboard...</div>

<table id="leaderboard" style="display:none;">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Tag</th>
      <th>Username</th>
      <th>Money</th>
    </tr>
  </thead>
  <tbody id="leaderboardBody"></tbody>
</table>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD_OXSvcK9AWoCU0AaXuc7Z7sMhEV1nBg4",
  authDomain: "fireworkleaderboard.firebaseapp.com",
  databaseURL: "https://fireworkleaderboard-default-rtdb.firebaseio.com",
  projectId: "fireworkleaderboard",
  storageBucket: "fireworkleaderboard.firebasestorage.app",
  messagingSenderId: "243474267364",
  appId: "1:243474267364:web:8f0f2bedbbbca3c05f40f1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Owner fallback UID
const OWNER_UIDS = { "FaZgGtIHzVcnSS6c8JAoir9RG8J2": true };

// Tag definitions
const TAGS = {
  owner: { name: "Owner", class: "owner" },
  vip: { name: "VIP", class: "vip" },
  streamer: { name: "STREAMER", class: "streamer" },
  fart: { name: "Fart", class: "fart" },
  donator: { name: "DONATOR", class: "donator" },
  youtuber: { name: "YOUTUBER", class: "youtuber" },
  regular: { name: "Regular", class: "regular" },
  mystery: { name: "???", class: "mystery" }
};

const body = document.getElementById('leaderboardBody');
const loading = document.getElementById('loading');

// --- Data storage ---
let progress = {}, usernames = {}, users = {}, admins = {}, activeTags = {};

// --- Build leaderboard ---
function buildLeaderboard() {
  body.innerHTML = '';
  const uids = new Set([
    ...Object.keys(progress || {}),
    ...Object.keys(usernames || {}),
    ...Object.keys(users || {})
  ]);

  const data = [];
  uids.forEach(uid => {
    const money = progress[uid]?.money ?? 0;
    let uname = usernames[uid] || (users[uid]?.username) || 'Unknown';

    // Tag priority: admin > owner fallback > active tag > regular
    let tag = 'regular';
    if(admins[uid] || OWNER_UIDS[uid]) tag = 'owner';
    else if(activeTags[uid]) tag = activeTags[uid];

    data.push({ uid, money, uname, tag });
  });

  // Sort by money descending
  data.sort((a,b) => b.money - a.money);

  data.forEach((u, i) => {
    const tr = document.createElement('tr');
    tr.dataset.uid = u.uid; // for live updates
    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="tag ${TAGS[u.tag]?.class || 'regular'}">${TAGS[u.tag]?.name || 'Regular'}</td>
      <td>${u.uname}</td>
      <td>${u.money}</td>
    `;
    body.appendChild(tr);
  });

  loading.style.display = 'none';
  document.getElementById('leaderboard').style.display = 'table';
}

// --- Load static data once ---
Promise.all([
  db.ref('progress').once('value'),
  db.ref('usernames').once('value'),
  db.ref('users').once('value'),
  db.ref('admins').once('value'),
  db.ref('activeTag').once('value')
]).then(([pSnap, uSnap, usSnap, aSnap, tSnap])=>{
  progress = pSnap.val() || {};
  usernames = uSnap.val() || {};
  users = usSnap.val() || {};
  admins = aSnap.val() || {};
  activeTags = tSnap.val() || {};
  buildLeaderboard();
});

// --- Listen for progress changes ---
db.ref('progress').on('value', snap => {
  progress = snap.val() || {};
  buildLeaderboard();
});

// --- Listen for usernames changes ---
db.ref('usernames').on('value', snap => {
  usernames = snap.val() || {};
  buildLeaderboard();
});

// --- Listen for users changes ---
db.ref('users').on('value', snap => {
  users = snap.val() || {};
  buildLeaderboard();
});

// --- Listen for admin changes ---
db.ref('admins').on('value', snap => {
  admins = snap.val() || {};
  buildLeaderboard();
});

// --- Listen for activeTag changes (equip/unequip) ---
db.ref('activeTag').on('value', snap => {
  activeTags = snap.val() || {};
  buildLeaderboard();
});
</script>
</body>
</html>
